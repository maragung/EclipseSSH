# Fast merge gate. Lint and unit tests, in two parallel jobs, dispatched for the
# branches being landed.
#
# This is the gate a merge waits for. The full ci.yml run - verify, APK/AAB, the
# signing check - follows on main afterwards as the safety net, so a green here
# means "this is worth landing now" and the heavier gate still gets its say, on
# main, instead of holding the branch hostage for an hour first.
#
# Two jobs rather than one, each with its own budget, because of what the single
# job got wrong: it ran lint and then the tests under one 45-minute cap, so a
# branch whose suite needed longer than that could never go green - the run was
# killed at the cap every time, and a gate cannot tell a kill from a failure.
# Splitting them also runs the two halves at the same time instead of in a
# queue, and keeps every runner comfortably under the 60-minute ceiling.
#
# The 45-60 minute verify suite is the price of "everything is verified in CI";
# this is the cheaper loop for the pushes in between: the same pinned toolchain
# and the same Robolectric cache as ci.yml, but it stops after the unit tests.
# No APK, no AAB, no signing material, no dependency-lockfile check.
#
# Deliberately NOT triggered by pull_request: the branches being landed dispatch
# it explicitly (see the merge helpers in this repo), so a PR does not pay for a
# second full run on commits that already have one.
name: Fast test

on:
  push:
    branches: ['fast-test/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One fast-test run per ref; a newer dispatch replaces the older run, which is
  # what a re-dispatch after a fix wants - the superseded run has nothing left
  # to say about the commits that replaced it.
  group: fast-test-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dfile.encoding=UTF-8
  # The same pins as ci.yml - a fast loop that verifies against a different
  # toolchain than the merge gate verifies against is not fast, it is wrong.
  BUILD_TOOLS: '35.0.0'
  COMPILE_SDK: 'android-35'
  MIN_SDK: '28'
  TARGET_SDK: 'android-35'
  FREERDP_NDK_VERSION: '29.0.13113456'
  FREERDP_CMAKE_VERSION: '4.1.2'

jobs:
  verify:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    # Per-shard, because the two halves are not the same size: the test suite is
    # the long pole and needs the room the lint half does not. Both stay under
    # the ceiling, and the shell-level cap in the task step fires first so a
    # wedged run leaves evidence behind rather than a bare job kill.
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      # Both shards report, always: if the tests hang the lint result is still
      # worth having, and one cycle should answer both questions.
      fail-fast: false
      matrix:
        include:
          - name: Lint (release variant)
            timeout: 45
            cap: 40m
            task: lintRelease
            # Strings, and compared as strings below: a matrix boolean arrives
            # in an expression as the text "false", which is truthy, and a gate
            # that starts an SSH sandbox for a lint run is a confusing way to
            # find that out.
            sshd: 'false'
          - name: Unit and integration tests
            timeout: 55
            cap: 50m
            task: testDebugUnitTest
            sshd: 'true'

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17.0.13
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v4.1.0
        with:
          distribution: temurin
          java-version: '17.0.13'
          check-latest: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          cmdline-tools-version: '11479570'
          packages: >-
            platform-tools
            platforms;${{ env.COMPILE_SDK }}
            build-tools;${{ env.BUILD_TOOLS }}
            ndk;${{ env.FREERDP_NDK_VERSION }}
          cache-packages: true

      - name: Install pinned CMake and Ninja
        # Needed by both shards, not just an APK build: lint compiles :freerdp
        # and the tests link it, and the native build drives CMake directly
        # (same reasoning as ci.yml's step of the same name). The two shards
        # each pay for it; the shared build-tree cache below is what keeps that
        # cheap.
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check \
            "cmake==${FREERDP_CMAKE_VERSION}" ninja
          cmake --version | grep -F "cmake version ${FREERDP_CMAKE_VERSION}"
          ninja --version

      - name: Cache the FreeRDP native build tree
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4.2.0
        with:
          path: freerdp/build
          key: freerdp-native-${{ runner.os }}-${{ hashFiles('freerdp/build.gradle.kts') }}

      - name: Install patch (proot-patches are applied by fetchLinuxSource)
        run: sudo apt-get install -y -qq patch

      - name: Cache the Linux userspace native build tree
        # Read-only, like the FreeRDP entry above: the shards rely on main's
        # ci.yml having saved this key, and a cold build (tarball fetch plus
        # three quick proot builds) is the fallback on a fresh pin.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4.2.0
        with:
          path: linux/build
          key: linux-native-${{ runner.os }}-${{ hashFiles('linux/build.gradle.kts', 'linux/proot-patches/*.patch') }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # Read-only here unconditionally: the shards run concurrently and must
          # not race each other for the same cache entries, and a gate's caches
          # have no business writing into the branch's read-only posture.
          cache-read-only: true

      - name: Cache Robolectric runtime jars
        if: matrix.sshd == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4.2.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ env.COMPILE_SDK }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: robolectric-${{ runner.os }}-${{ env.COMPILE_SDK }}-

      - name: Start the isolated OpenSSH sandbox
        if: matrix.sshd == 'true'
        run: |
          set -euo pipefail
          if ! command -v sshd >/dev/null 2>&1 && [ ! -x /usr/sbin/sshd ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq openssh-server
          fi
          tools/local-sshd.sh start
          test -f .tmp-build/sshd-test/port
          test -f .tmp-build/sshd-test/port-no-shell

      - name: ${{ matrix.name }}
        # Wrapped in a hard cap of its own, five minutes under the job's, because
        # the failure this gate kept hitting was invisible: a test that never
        # returns leaves the log silent for half an hour and then the job is
        # killed, and there is nothing in that log to read. SIGQUIT first, which
        # makes the JVM print every thread's stack, so the next wedge names its
        # own culprit instead of costing another day of guessing. The cap firing
        # is itself the finding: a run that reaches it is stuck, not slow.
        run: timeout --signal=QUIT --kill-after=60s ${{ matrix.cap }} ./gradlew --stacktrace ${{ matrix.task }}

      - name: Stop the OpenSSH sandbox
        if: always() && matrix.sshd == 'true'
        run: tools/local-sshd.sh clean
