# Answers "is the release signing key still where CI keeps it, and is it the right
# one?" - on demand, without ever exporting it.
#
# The key lives in the `RELEASE_KEYSTORE_BASE64` secret and nowhere else. This
# workflow materialises it on the runner, checks its certificate against the
# canonical fingerprint, prints only the facts every published APK already
# carries, and shreds it again - on success and on failure alike, from an EXIT
# trap, so a red run cannot leave it on disk.
#
# It is deliberately not `export-signing-material.yml`. That workflow uploads the
# key *in the clear* as a downloadable artifact and can only be dispatched while
# the repository is private; this one uploads nothing at all and is safe to run
# while public, because the keystore never leaves the runner and the output is a
# fingerprint. Use this to check the key is intact and canonical; use
# `release.yml` (dispatch) to actually sign with it, which restores, signs and
# shreds the same way.
#
# See AUDIT-REPORT.md section 107.
name: Signing key check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Verify the CI-held release keystore
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17.0.13
        # For `keytool`, which is the whole of this job.
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v4.1.0
        with:
          distribution: temurin
          java-version: '17.0.13'
          check-latest: false

      - name: Restore the keystore, verify it, and shred it
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PROPERTIES: ${{ secrets.RELEASE_KEYSTORE_PROPERTIES }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_KEYSTORE_BASE64" ] || [ -z "$RELEASE_KEYSTORE_PROPERTIES" ]; then
            echo "The signing secrets are not set on this repository. The release build would fall"
            echo "back to the debug key, which no existing install accepts as an update."
            exit 1
          fi

          WORK="$(mktemp -d)"
          # On failure as much as on success: this is the whole point of the
          # workflow, and `set -e` above must not be able to skip it.
          trap 'rm -rf "$WORK"' EXIT
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$WORK/eclipse-release.jks"
          printf '%s\n' "$RELEASE_KEYSTORE_PROPERTIES" > "$WORK/keystore.properties"
          chmod 600 "$WORK/eclipse-release.jks" "$WORK/keystore.properties"

          # Fails unless the certificate is the canonical one, and says which it
          # found when it is not.
          testing/verify-keystore.sh "$WORK/eclipse-release.jks" "$WORK/keystore.properties"

          # Public facts, for the run log: the same certificate the published APKs
          # carry. Nothing here is secret, and the store password is not printed.
          echo
          echo "== certificate (public - every published APK carries it)"
          STOREPASS="$(sed -n 's/^storePassword=//p' "$WORK/keystore.properties")"
          ALIAS="$(sed -n 's/^keyAlias=//p' "$WORK/keystore.properties")"
          "$JAVA_HOME/bin/keytool" -list -v -keystore "$WORK/eclipse-release.jks" \
            -storepass "$STOREPASS" -alias "$ALIAS" \
            | grep -E 'Alias name|Owner|Valid from|SHA256:'
          echo
          echo "The keystore is present and canonical. It is shredded as this step exits."
