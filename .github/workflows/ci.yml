        # failure class the wipe guard exists for).
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4.2.0
        with:
          path: freerdp/build
          key: freerdp-native-${{ runner.os }}-${{ hashFiles('freerdp/build.gradle.kts') }}

      - name: Install patch (proot-patches are applied by fetchLinuxSource)
        run: sudo apt-get install -y -qq patch

      - name: Cache the Linux userspace native build tree
        # Same contract as the FreeRDP restore above: needs:native guarantees
        # the native job's post-step save of this exact key is visible here,
        # so :linux's preBuild-wired fetch and build tasks find their declared
        # outputs and go UP-TO-DATE. Restored, never written, and no
        # restore-keys for the same reason the FreeRDP cache has none.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4.2.0
        with:
          path: linux/build
          key: linux-native-${{ runner.os }}-${{ hashFiles('linux/build.gradle.kts', 'linux/proot-patches/*.patch') }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
        with:
          # Read-only off main so a pull request cannot poison the cache the
          # default branch reads.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Cache Robolectric runtime jars
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4.2.0
        with:
          path: ~/.m2/repository/org/robolectric
          # Keyed on the version catalog only. The compile SDK is part of the
          # literal prefix so a 35 -> 36 bump is a different key, but a
          # whitespace-only change in app/build.gradle.kts is not.
          key: robolectric-${{ runner.os }}-${{ env.COMPILE_SDK }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: robolectric-${{ runner.os }}-${{ env.COMPILE_SDK }}-

      - name: Start the isolated OpenSSH sandbox
        # See tools/local-sshd.sh. The matrix needs a real sshd, not a MINA
        # server, because interop bugs live in the gap the in-JVM server
        # cannot reproduce.
        run: |
          set -euo pipefail
          if ! command -v sshd >/dev/null 2>&1 && [ ! -x /usr/sbin/sshd ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq openssh-server
          fi
          tools/local-sshd.sh start
          # Asserted rather than assumed. A missing sandbox turns into a
          # silently-skipped test otherwise.
          test -f .tmp-build/sshd-test/port
          test -f .tmp-build/sshd-test/port-no-shell

      - name: Unit and integration tests
        # Debug variant only: AGP 9 removed the release unit-test variant
        # (`testReleaseUnitTest` no longer exists), and the AndroidX/Robolectric
        # suites here are variant-independent — the release side keeps its own
        # coverage through lintRelease and the assembled release artifacts.
        run: ./gradlew --stacktrace testDebugUnitTest

      - name: Stop the OpenSSH sandbox
        if: always()
        run: tools/local-sshd.sh clean

      - name: Upload test and lint reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports
          path: |
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: warn
          retention-days: 14

