            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > keystore/eclipse-release.jks
            printf '%s\n' "$RELEASE_KEYSTORE_PROPERTIES" > keystore.properties
            chmod 600 keystore/eclipse-release.jks keystore.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No signing secrets set: the release APK will carry the debug key." >&2
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify the androidTest sources have at least one test
        # An empty androidTest set compiles green and is indistinguishable from
        # "instrumentation is being tested" in the run summary. Assert it
        # before running the build so a future contributor cannot silently
        # delete the suite and keep a green check.
        run: |
          set -euo pipefail
          COUNT=$(find app/src/androidTest -name '*.kt' | wc -l)
          if [ "$COUNT" -lt 1 ]; then
            echo "No androidTest sources found in app/src/androidTest."
            exit 1
          fi
          echo "androidTest sources: $COUNT"

      - name: Compile instrumentation tests
        # Kept even though .github/workflows/instrumentation.yml now runs
        # `connectedAndroidTest` on a hosted emulator: compiling the sources
        # here keeps this workflow's own build honest about androidTest
        # breakage instead of waiting for the separate workflow's longer
        # pipeline to report it.
        run: ./gradlew --stacktrace assembleDebugAndroidTest

      - name: Assemble APKs and the AAB (Play upload format)
        # One invocation, deliberately: a bundle task in it stands splits.abi
        # down (AGP's PerModuleBundleTask cannot read a shrunk-resources
        # directory holding more than one file - issuetracker.google.com/
        # 402800800), so CI's APKs are the universal ones. The per-ABI APKs are
        # the release workflows' product, built there in a bundle-free
        # invocation. The Play Store accepts an AAB, not an APK; it is built
        # with the same signing config the APK uses, signed with the same key.
        run: ./gradlew --stacktrace assembleDebug assembleRelease bundleRelease

      - name: Verify the release APK signatures
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          mapfile -t APKS < <(find app/build/outputs/apk/release -name '*.apk' | sort)
          test "${#APKS[@]}" -ge 1 || { echo "no release APKs found"; exit 1; }
          for APK in "${APKS[@]}"; do
            echo "== Verifying $APK"
            "$APKSIGNER" verify --verbose --min-sdk-version 28 --print-certs "$APK"
            if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
              "$APKSIGNER" verify --verbose --min-sdk-version 24 "$APK" | tee /tmp/sigs.txt
              grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/sigs.txt
              grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" /tmp/sigs.txt
            fi
          done

      - name: Verify the AAB signature
        # The apksigner tool's APK format check refuses AABs because they
        # put AndroidManifest.xml under base/manifest/ rather than at the
        # archive root. AABs are signed with the JAR signature scheme
        # (META-INF/{ALIAS}.SF + META-INF/{ALIAS}.RSA), not the APK
        # Signature Scheme. Assert the JAR signature blocks are present
        # and the .SF references the AAB manifest.
        run: |
          set -euo pipefail
          AAB="$(find app/build/outputs/bundle/release -name '*.aab' | head -1)"
          test -n "$AAB" || { echo "no AAB found in app/build/outputs/bundle/release"; exit 1; }
          echo "== AAB under test: $AAB"
          unzip -l "$AAB" | grep -E 'META-INF/[^/]+\.(SF|RSA|DSA|EC)$' | tee /tmp/aab-sigs.txt
          grep -q '\.SF' /tmp/aab-sigs.txt || { echo "no JAR .SF in AAB"; exit 1; }
          grep -q '\.RSA\|\.DSA\|\.EC' /tmp/aab-sigs.txt || { echo "no JAR signature block in AAB"; exit 1; }
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            echo "AAB is signed with the release key."
          else
            echo "AAB is signed with the debug key (no release secrets in CI)."
          fi

      - name: Verify the dependency lockfile is up to date
        # The lockfile pins the *resolution* of every dependency, not just the
        # version the catalog names. A transitive bump that is not reflected
        # in the lockfile is a silent reproducibility loss. The check below
        # runs a `dependencies` task against the lockfile; any drift fails
        # the build rather than letting it through.
        run: ./gradlew --stacktrace :app:dependencies --configuration releaseRuntimeClasspath --write-locks

      # The artifact uploads are convenience copies, not verification: everything they
      # carry was already built and checked by the assemble and signature steps above.
      # They are continue-on-error because the account-level artifact storage quota
      # runs out from ordinary CI traffic and is only recalculated every 6-12 hours —
      # a full, correct build must not report red because a convenience copy could
      # not be stored.
      - name: Upload debug APK
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eclipse-ssh-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APKs
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eclipse-ssh-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload release AAB
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eclipse-ssh-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Shred signing material
        if: always()
        run: |
          rm -f keystore.properties
          rm -rf keystore

  # The gate the v1.1.16 crash slipped through. CI proved the APKs compiled
  # and were signed, and the installed app still died before its first frame
  # on every device - an ExceptionInInitializerError from a Bouncy Castle
  # provider collision that the JVM test host cannot reproduce, because the
  # host JVM has no platform provider to collide with. Only booting the
  # produced artifact catches that class. GitHub's Linux runners expose
  # /dev/kvm, so a headless emulator is affordable here: this job installs
  # the exact APKs the assemble job uploaded and launches each one, and
  # fails if the process is gone or anything fatal landed in the logcat.
  #
  # Both variants, deliberately: the debug build is the plainest possible
  # "does the app open"; the release build carries R8, whose keep-rule
  # mistakes are a crash class the debug build can never catch.
  smoke:
    name: Boot the built APKs (crash-on-open gate)
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          # Same cmdline-tools pin as the build jobs. No NDK and no Gradle
          # here: this job only boots an emulator and installs prebuilt APKs,
          # so it does not need the native toolchain the build jobs pin.
          cmdline-tools-version: '11479570'
          packages: >-
            platform-tools
            emulator
            system-images;android-35;default;x86_64
          cache-packages: true

      - name: Enable KVM device permissions
        # The runner image ships /dev/kvm, but the runner user needs a udev
        # rule to open it. Without this the emulator falls back to software
        # emulation, which does not boot API 35 inside any sane timeout.
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # `udevadm trigger` returns before the udev worker has applied the
          # new mode - the same race the instrumentation workflow hit. Poll
          # for the node to settle, and chmod directly if it never does.
          for _ in $(seq 1 10); do
            [ -w /dev/kvm ] && break
            sleep 0.5
          done
          if [ ! -w /dev/kvm ]; then
            sudo chmod 0666 /dev/kvm || true
          fi
          test -w /dev/kvm || {
            echo "/dev/kvm is still not openable - this runner cannot run the emulator"
            ls -l /dev/kvm || true
            id
            exit 1
          }

      - name: Download the built APKs
        # The convenience copies the assemble job uploads. Downloading the
        # artifacts (rather than rebuilding here) is what makes this gate
        # about the produced bytes: the APK under the emulator is the same
        # file a user would install.
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: eclipse-ssh-*-apk
          path: apks

      - name: Create and boot the headless AVD
        run: |
          set -euo pipefail
          ADB="$ANDROID_HOME/platform-tools/adb"
          # avdmanager and the emulator each resolve their own AVD directory
          # when this is unset (the emulator searches $ANDROID_AVD_HOME,
          # $ANDROID_SDK_HOME/avd and $HOME/.android/avd, while cmdline-tools'
          # avdmanager is free to pick differently), and a create that lands
          # where the emulator never looks is an instant "Unknown AVD name"
          # death. Pin both ends to one directory - the same fix the
          # instrumentation workflow needed.
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --force --name ci-smoke \
            --package 'system-images;android-35;default;x86_64' \
            --device pixel_6
          # Assert the create landed where the emulator will look, with the
          # directory listing as the diagnosis if it did not.
          if ! "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx ci-smoke; then
            echo "avdmanager reported success but the emulator cannot see ci-smoke"
            ls -la "$ANDROID_AVD_HOME" || true
            exit 1
          fi
          nohup "$ANDROID_HOME/emulator/emulator" -avd ci-smoke \
            -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics \
            -gpu swiftshader_indirect -accel on > /tmp/emulator.log 2>&1 &
          # Bounded: an emulator that died at startup leaves adb with no device
          # to wait for, and an unbounded `wait-for-device` then hangs until the
          # job timeout instead of failing fast - the failure mode the first
          # hosted instrumentation run wedged on for over an hour.
          if ! timeout 120 "$ADB" wait-for-device; then
            echo "adb never saw the emulator - it likely died at startup"
            tail -200 /tmp/emulator.log
            exit 1
          fi
          # adb sees the emulator long before the guest OS is up;
          # sys.boot_completed is the flag the platform itself sets when
          # the boot intent fires. Five minutes is the generous ceiling:
          # with KVM this image is up in one to three.
          BOOT=""
          for _ in $(seq 1 60); do
            # A boot poll that outlives the emulator process is polling a
            # corpse; fail the moment the emulator is gone rather than
            # burning the remaining polls.
            if ! pgrep -f "emulator.*ci-smoke" >/dev/null; then
              echo "the emulator process died during boot"
              tail -200 /tmp/emulator.log
              exit 1
            fi
            BOOT="$("$ADB" shell getprop sys.boot_completed | tr -d '\r')"
            [ "$BOOT" = "1" ] && break
            sleep 5
          done
          if [ "$BOOT" != "1" ]; then
            echo "emulator did not finish booting"
            tail -200 /tmp/emulator.log
            exit 1
          fi

      - name: Launch the debug APK and assert it stays up
        env:
          # The debug build carries the .debug applicationId suffix, so both
          # variants install side by side and neither launch pollutes the
          # other's logcat window.
          PACKAGE: dev.eclipse.ssh.debug
          APK_DIR: apks/eclipse-ssh-debug-apk
          VARIANT: debug
        run: |
          set -euo pipefail
          ADB="$ANDROID_HOME/platform-tools/adb"
          APK="$(find "$APK_DIR" -name '*.apk' | head -1)"
          test -n "$APK" || { echo "no debug APK under $APK_DIR"; exit 1; }
          echo "== smoke [$VARIANT]: installing $APK"
          "$ADB" install -r "$APK"
          "$ADB" logcat -c
          "$ADB" shell am start -W -n "$PACKAGE/dev.eclipse.ssh.MainActivity"
          # Long enough for the first frame, DataStore reads, the provider
          # registry swap and the session service's notification - the exact
          # window in which the v1.1.16 crash fired.
          sleep 45
          "$ADB" logcat -d > "smoke-$VARIANT.log" || true
          PID="$("$ADB" shell pidof "$PACKAGE" | tr -d '\r')"
          test -n "$PID" || { echo "process $PACKAGE is not running 45s after launch"; exit 1; }
          if grep -Eq 'FATAL EXCEPTION|Fatal signal' "smoke-$VARIANT.log"; then
            echo "fatal exception while the app was running"
            grep -A40 -E 'FATAL EXCEPTION|Fatal signal' "smoke-$VARIANT.log" | head -120
            exit 1
          fi
          echo "== smoke [$VARIANT]: alive (pid $PID), no fatal exceptions"

      - name: Launch the release APK and assert it stays up
        env:
          PACKAGE: dev.eclipse.ssh
          APK_DIR: apks/eclipse-ssh-release-apk
          VARIANT: release
        run: |
          set -euo pipefail
          ADB="$ANDROID_HOME/platform-tools/adb"
          APK="$(find "$APK_DIR" -name '*.apk' | head -1)"
          test -n "$APK" || { echo "no release APK under $APK_DIR"; exit 1; }
          echo "== smoke [$VARIANT]: installing $APK"
          "$ADB" install -r "$APK"
          "$ADB" logcat -c
          "$ADB" shell am start -W -n "$PACKAGE/dev.eclipse.ssh.MainActivity"
          sleep 45
          "$ADB" logcat -d > "smoke-$VARIANT.log" || true
          PID="$("$ADB" shell pidof "$PACKAGE" | tr -d '\r')"
          test -n "$PID" || { echo "process $PACKAGE is not running 45s after launch"; exit 1; }
          if grep -Eq 'FATAL EXCEPTION|Fatal signal' "smoke-$VARIANT.log"; then
            echo "fatal exception while the app was running"
            grep -A40 -E 'FATAL EXCEPTION|Fatal signal' "smoke-$VARIANT.log" | head -120
            exit 1
          fi
          echo "== smoke [$VARIANT]: alive (pid $PID), no fatal exceptions"

      - name: Upload the device and emulator logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-device-logs
          path: |
            smoke-*.log
            /tmp/emulator.log
          if-no-files-found: warn
          retention-days: 14

  # The idle matrix, run only on demand (push-triggered idle tests would
  # burn the runner's metered time). The 30-minute idle test is the one
  # case that can catch a heartbeat that stopped reaching the wire, which
  # the rest of the suite cannot see.
  stress:
    name: Long idle stress test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17.0.13
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v4.1.0
        with:
          distribution: temurin
          java-version: '17.0.13'
          check-latest: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          # Same NDK pin the verify job installs: the stress job's build runs
          # :freerdp:buildFreerdpNative like every other build, and that task
          # resolves the toolchain from the SDK - without the pin the job fails
          # before the idle test it exists to run has started.
          cmdline-tools-version: '11479570'
          packages: >-
            platform-tools
            platforms;${{ env.COMPILE_SDK }}
            build-tools;${{ env.BUILD_TOOLS }}
            ndk;${{ env.FREERDP_NDK_VERSION }}
          cache-packages: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
        with:
          cache-read-only: true

      - name: Cache Robolectric runtime jars
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4.2.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ env.COMPILE_SDK }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: robolectric-${{ runner.os }}-${{ env.COMPILE_SDK }}-

      - name: Start the isolated OpenSSH sandbox
        run: |
          set -euo pipefail
          if ! command -v sshd >/dev/null 2>&1 && [ ! -x /usr/sbin/sshd ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq openssh-server
          fi
          tools/local-sshd.sh start
          test -f .tmp-build/sshd-test/port-silent
          test -f .tmp-build/sshd-test/port-no-shell

      - name: The idle matrix against a real OpenSSH server
        env:
          ECLIPSE_STRESS: '1'
        run: |
          set -euo pipefail
          ./gradlew --stacktrace :app:testDebugUnitTest \
            --tests '*RealOpenSshInteropRobolectricTest'
          RESULTS=app/build/test-results/testDebugUnitTest/TEST-dev.eclipse.ssh.RealOpenSshInteropRobolectricTest.xml
          grep -q 'skipped="0"' "$RESULTS"
          sed -n 's/.*\(tests="[0-9]*"\).*\(failures="[0-9]*"\).*/\1 \2/p' "$RESULTS" | head -1

      - name: Stop the OpenSSH sandbox
        if: always()
        # `stop`, not `clean`: the sandbox's sshd.log is the only honest witness to a heartbeat
        # failure, because it names every login and every keepalive the run produced, from every
        # port, with timestamps. `clean` deletes it before the artifact upload below can reach it,
        # which cost a full 65-minute stress round once already. The runner is ephemeral, so leaving
        # the sandbox directory behind costs nothing.
        run: tools/local-sshd.sh stop

      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stress-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            .tmp-build/sshd-test/sshd.log
          retention-days: 14
