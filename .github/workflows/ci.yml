            platforms;${{ env.COMPILE_SDK }}
            build-tools;${{ env.BUILD_TOOLS }}
            ndk;${{ env.FREERDP_NDK_VERSION }}
          cache-packages: true
          # ANDROID_HOME / ANDROID_SDK_ROOT are exported automatically.

      - name: Install pinned CMake and Ninja
        # The :freerdp native build drives CMake directly (see
        # freerdp/build.gradle.kts for why it does not use AGP's
        # externalNativeBuild). The SDK manager does not carry the CMake line
        # that build needs; PyPI does. Same pin the spike verified with.
