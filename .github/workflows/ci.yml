          distribution: temurin
          java-version: '17.0.13'
          # check-latest=false forces the action to use the requested 17.0.13
          # rather than "the latest Temurin 17", which would silently drift.
          check-latest: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          # cmdline-tools 13.0 is the LTS line that ships platform-tools and
          # supports platforms;android-37.0 + build-tools;36.0.0.
          cmdline-tools-version: '11479570'
