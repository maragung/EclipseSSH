# CI gate. Runs on every push to main, every pull request, and on demand.
#
# Pinned to commit SHAs for every `uses:` line so a future tag rewrite cannot
# silently change what the workflow does. Floating `@vN` references have been
# a real supply-chain vector in the last few years (tj-actions, action-gh-release
# force-push incidents) and the brief explicitly requires reproducible builds.
#
# Toolchain is pinned too: Ubuntu 24.04, JDK 17.0.13, Android SDK 37, build-tools
# 36.0.0, Gradle 9.7.1. The Android SDK is installed by the workflow itself,
# not assumed to be on the runner image, so the build bytes are not at the mercy
# of whatever ubuntu-latest happens to ship on a given Monday.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A follow-up push cancels the in-progress run on the same branch. A
  # pull_request run is NOT cancelled, because a cancelled PR check fails
  # branch protection with a status it cannot recover from.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dfile.encoding=UTF-8
  # Pinned to the exact build-tools version the build is verified against.
  # apksigner/aapt2 are addressed as $ANDROID_HOME/build-tools/$BUILD_TOOLS/...
  # so a future image cannot pick a different binary by accident.
  BUILD_TOOLS: '36.0.0'
  COMPILE_SDK: 'android-37'
  MIN_SDK: '28'
  TARGET_SDK: 'android-35'
  # The NDK and CMake the :freerdp module's native build is pinned to
  # (freerdp/build.gradle.kts). Same pins the FreeRDP spike proved the build
  # with. The SDK manager does not carry CMake 4.x, hence the PyPI install.
  FREERDP_NDK_VERSION: '29.0.13113456'
  FREERDP_CMAKE_VERSION: '4.1.2'

jobs:
  verify:
    name: Lint, tests, APKs and AAB
    runs-on: ubuntu-24.04
    # Generous because the first run after any freerdp/build.gradle.kts change
    # pays a cold, uncached four-ABI native build (~30 min) on top of the
    # usual suite; warm runs stay well inside the previous budget.
    timeout-minutes: 120

    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 17.0.13
        uses: actions/setup-java@6a0805fcefea3d4657a47ac4c165951e33482018 # v4.1.0
        with:
          distribution: temurin
          java-version: '17.0.13'
          # check-latest=false forces the action to use the requested 17.0.13
          # rather than "the latest Temurin 17", which would silently drift.
          check-latest: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          # cmdline-tools 13.0 is the LTS line that ships platform-tools and
          # supports platforms;android-37 + build-tools;36.0.0.
          cmdline-tools-version: '11479570'
          packages: >-
            platform-tools
            platforms;${{ env.COMPILE_SDK }}
            build-tools;${{ env.BUILD_TOOLS }}
            ndk;${{ env.FREERDP_NDK_VERSION }}
          cache-packages: true
          # ANDROID_HOME / ANDROID_SDK_ROOT are exported automatically.

      - name: Install pinned CMake and Ninja
        # The :freerdp native build drives CMake directly (see
        # freerdp/build.gradle.kts for why it does not use AGP's
        # externalNativeBuild). The SDK manager does not carry the CMake line
        # that build needs; PyPI does. Same pin the spike verified with.
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check \
            "cmake==${FREERDP_CMAKE_VERSION}" ninja
          cmake --version | grep -F "cmake version ${FREERDP_CMAKE_VERSION}"
          ninja --version

      - name: Cache the FreeRDP native build tree
        # freerdp/build holds the extracted tarball, the per-ABI superbuild
        # trees (OpenSSL + FreeRDP + friends) and the packaged jniLibs. A cold
        # native build is roughly half an hour for four ABIs; a warm one is a
        # CMake no-op. The key carries the module's build script because that
        # is where the tarball, NDK and feature-set pins live - changing any of
        # them must produce a different cache entry. Restored before any Gradle
        # step: the first Gradle invocation (lint) already compiles :freerdp,
        # which builds the native libraries.
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.0
        with:
          path: freerdp/build
          key: freerdp-native-${{ runner.os }}-${{ hashFiles('freerdp/build.gradle.kts') }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@fb1f4ada2cbb5ec87bbd7dcd598c601ff59a1f7b # v4.0.0
        with:
          # Read-only off main so a pull request cannot poison the cache the
          # default branch reads.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Cache Robolectric runtime jars
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.0
        with:
          path: ~/.m2/repository/org/robolectric
          # Keyed on the version catalog only. The compile SDK is part of the
          # literal prefix so a 35 -> 36 bump is a different key, but a
          # whitespace-only change in app/build.gradle.kts is not.
          key: robolectric-${{ runner.os }}-${{ env.COMPILE_SDK }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: robolectric-${{ runner.os }}-${{ env.COMPILE_SDK }}-

      - name: Restore release signing material
        id: signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PROPERTIES: ${{ secrets.RELEASE_KEYSTORE_PROPERTIES }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$RELEASE_KEYSTORE_PROPERTIES" ]; then
            mkdir -p keystore
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > keystore/eclipse-release.jks
            printf '%s\n' "$RELEASE_KEYSTORE_PROPERTIES" > keystore.properties
            chmod 600 keystore/eclipse-release.jks keystore.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No signing secrets set: the release APK will carry the debug key." >&2
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify the androidTest sources have at least one test
        # An empty androidTest set compiles green and is indistinguishable from
        # "instrumentation is being tested" in the run summary. Assert it
        # before running the build so a future contributor cannot silently
        # delete the suite and keep a green check.
        run: |
          set -euo pipefail
          COUNT=$(find app/src/androidTest -name '*.kt' | wc -l)
          if [ "$COUNT" -lt 1 ]; then
            echo "No androidTest sources found in app/src/androidTest."
            exit 1
          fi
          echo "androidTest sources: $COUNT"

      - name: Lint (release variant)
        run: ./gradlew --stacktrace lintRelease

      - name: Start the isolated OpenSSH sandbox
        # See tools/local-sshd.sh. The matrix needs a real sshd, not a MINA
        # server, because interop bugs live in the gap the in-JVM server
        # cannot reproduce.
        run: |
          set -euo pipefail
          if ! command -v sshd >/dev/null 2>&1 && [ ! -x /usr/sbin/sshd ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq openssh-server
          fi
          tools/local-sshd.sh start
          # Asserted rather than assumed. A missing sandbox turns into a
          # silently-skipped test otherwise.
          test -f .tmp-build/sshd-test/port
          test -f .tmp-build/sshd-test/port-no-shell

      - name: Unit and integration tests
        # Debug variant only: AGP 9 removed the release unit-test variant
        # (`testReleaseUnitTest` no longer exists), and the AndroidX/Robolectric
        # suites here are variant-independent — the release side keeps its own
        # coverage through lintRelease and the assembled release artifacts below.
        run: ./gradlew --stacktrace testDebugUnitTest

      - name: Stop the OpenSSH sandbox
        if: always()
        run: tools/local-sshd.sh clean

      - name: Build and verify the :freerdp native module
        # Every :freerdp compilation depends on the native build task, so the
        # libraries exist by the time lint got here; this step still runs the
        # module's own packaging and asserts the product: all eight .so files
        # per ABI, and the bridge .so is an ELF binary for the architecture it
        # is filed under. A wrong-ABI library is exactly the failure packaging
        # would otherwise hide until install time - the same check the FreeRDP
        # spike used.
        run: |
          set -euo pipefail
          ./gradlew --stacktrace :freerdp:assembleDebug
          declare -A ELF_SIGNATURE=(
            [arm64-v8a]='ARM aarch64'
            [armeabi-v7a]='ARM, EABI5'
            [x86_64]='x86-64'
            [x86]='Intel 80386'
          )
          for ABI in arm64-v8a armeabi-v7a x86_64 x86; do
            for LIB in libfreerdp-android libfreerdp3 libfreerdp-client3 libwinpr3 \
                       libcrypto libssl libcjson liburiparser; do
              SO="freerdp/build/native/jniLibs/${ABI}/${LIB}.so"
              test -f "${SO}" || { echo "missing ${SO}"; exit 1; }
            done
            file "freerdp/build/native/jniLibs/${ABI}/libfreerdp-android.so" \
              | grep -F "${ELF_SIGNATURE[${ABI}]}"
            echo "verified ${ABI}: ${ELF_SIGNATURE[${ABI}]}"
          done

      - name: Compile instrumentation tests
        # The instrumentation sources cannot run here (the runner has no KVM
        # and the guest kills system_server on boot), so they are compiled
        # to keep them honest. The actual `connectedAndroidTest` run lives
        # in .github/workflows/instrumentation.yml, gated behind a
        # self-hosted runner label.
        run: ./gradlew --stacktrace assembleDebugAndroidTest

      - name: Assemble APKs
        run: ./gradlew --stacktrace assembleDebug assembleRelease

      - name: Assemble AAB (Play upload format)
        # The Play Store accepts an AAB, not an APK. Built with the same
        # signing config the APK uses, signed with the same key.
        run: ./gradlew --stacktrace bundleRelease

      - name: Verify the release APK signatures
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          mapfile -t APKS < <(find app/build/outputs/apk/release -name '*.apk' | sort)
          test "${#APKS[@]}" -ge 1 || { echo "no release APKs found"; exit 1; }
          for APK in "${APKS[@]}"; do
            echo "== Verifying $APK"
            "$APKSIGNER" verify --verbose --min-sdk-version 28 --print-certs "$APK"
            if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
              "$APKSIGNER" verify --verbose --min-sdk-version 24 "$APK" | tee /tmp/sigs.txt
              grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/sigs.txt
              grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" /tmp/sigs.txt
            fi
          done

      - name: Verify the AAB signature
        # The apksigner tool's APK format check refuses AABs because they
        # put AndroidManifest.xml under base/manifest/ rather than at the
        # archive root. AABs are signed with the JAR signature scheme
        # (META-INF/{ALIAS}.SF + META-INF/{ALIAS}.RSA), not the APK
        # Signature Scheme. Assert the JAR signature blocks are present
        # and the .SF references the AAB manifest.
        run: |
          set -euo pipefail
          AAB="$(find app/build/outputs/bundle/release -name '*.aab' | head -1)"
          test -n "$AAB" || { echo "no AAB found in app/build/outputs/bundle/release"; exit 1; }
          echo "== AAB under test: $AAB"
          unzip -l "$AAB" | grep -E 'META-INF/[^/]+\.(SF|RSA|DSA|EC)$' | tee /tmp/aab-sigs.txt
          grep -q '\.SF' /tmp/aab-sigs.txt || { echo "no JAR .SF in AAB"; exit 1; }
          grep -q '\.RSA\|\.DSA\|\.EC' /tmp/aab-sigs.txt || { echo "no JAR signature block in AAB"; exit 1; }
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            echo "AAB is signed with the release key."
          else
            echo "AAB is signed with the debug key (no release secrets in CI)."
          fi

      - name: Verify the dependency lockfile is up to date
        # The lockfile pins the *resolution* of every dependency, not just the
        # version the catalog names. A transitive bump that is not reflected
        # in the lockfile is a silent reproducibility loss. The check below
        # runs a `dependencies` task against the lockfile; any drift fails
        # the build rather than letting it through.
        run: ./gradlew --stacktrace :app:dependencies --configuration releaseRuntimeClasspath --write-locks

      # The artifact uploads are convenience copies, not verification: everything they
      # carry was already built and checked by the assemble and signature steps above.
      # They are continue-on-error because the account-level artifact storage quota
      # runs out from ordinary CI traffic and is only recalculated every 6-12 hours —
      # a full, correct build must not report red because a convenience copy could
      # not be stored.
      - name: Upload debug APK
        continue-on-error: true
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: eclipse-ssh-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APKs
        continue-on-error: true
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: eclipse-ssh-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload release AAB
        continue-on-error: true
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: eclipse-ssh-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload test and lint reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: reports
          path: |
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: warn
          retention-days: 14

      - name: Shred signing material
        if: always()
        run: |
          rm -f keystore.properties
          rm -rf keystore

  # The idle matrix, run only on demand (push-triggered idle tests would
  # burn the runner's metered time). The 30-minute idle test is the one
  # case that can catch a heartbeat that stopped reaching the wire, which
  # the rest of the suite cannot see.
  stress:
    name: Long idle stress test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 17.0.13
        uses: actions/setup-java@6a0805fcefea3d4657a47ac4c165951e33482018 # v4.1.0
        with:
          distribution: temurin
          java-version: '17.0.13'
          check-latest: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          cmdline-tools-version: '11479570'
          packages: >-
            platform-tools
            platforms;${{ env.COMPILE_SDK }}
            build-tools;${{ env.BUILD_TOOLS }}
          cache-packages: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@fb1f4ada2cbb5ec87bbd7dcd598c601ff59a1f7b # v4.0.0
        with:
          cache-read-only: true

      - name: Cache Robolectric runtime jars
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ env.COMPILE_SDK }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: robolectric-${{ runner.os }}-${{ env.COMPILE_SDK }}-

      - name: Start the isolated OpenSSH sandbox
        run: |
          set -euo pipefail
          if ! command -v sshd >/dev/null 2>&1 && [ ! -x /usr/sbin/sshd ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq openssh-server
          fi
          tools/local-sshd.sh start
          test -f .tmp-build/sshd-test/port-silent
          test -f .tmp-build/sshd-test/port-no-shell

      - name: The idle matrix against a real OpenSSH server
        env:
          ECLIPSE_STRESS: '1'
        run: |
          set -euo pipefail
          ./gradlew --stacktrace :app:testDebugUnitTest \
            --tests '*RealOpenSshInteropRobolectricTest'
          RESULTS=app/build/test-results/testDebugUnitTest/TEST-dev.eclipse.ssh.RealOpenSshInteropRobolectricTest.xml
          grep -q 'skipped="0"' "$RESULTS"
          sed -n 's/.*\(tests="[0-9]*"\).*\(failures="[0-9]*"\).*/\1 \2/p' "$RESULTS" | head -1

      - name: Stop the OpenSSH sandbox
        if: always()
        # `stop`, not `clean`: the sandbox's sshd.log is the only honest witness to a heartbeat
        # failure, because it names every login and every keepalive the run produced, from every
        # port, with timestamps. `clean` deletes it before the artifact upload below can reach it,
        # which cost a full 65-minute stress round once already. The runner is ephemeral, so leaving
        # the sandbox directory behind costs nothing.
        run: tools/local-sshd.sh stop

      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: stress-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            .tmp-build/sshd-test/sshd.log
          retention-days: 14
