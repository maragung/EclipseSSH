        # native build is roughly half an hour for four ABIs; a warm one is a
        # CMake no-op. The key carries the module's build script because that
        # is where the tarball, NDK and feature-set pins live - changing any of
        # them must produce a different cache entry. Restored before any Gradle
        # step: the first Gradle invocation (lint) already compiles :freerdp,
        # which builds the native libraries.
        #
        # Restored, not written, on the normal path: needs:native guarantees
        # the native job's post-step save of this exact key is already visible
        # to this job in the same run, so the preBuild-wired native tasks find
        # their declared outputs and go UP-TO-DATE - this job pays a tarball
        # extract, never a rebuild. No restore-keys on purpose: a fuzzy restore
        # can pair stale cmake trees with fresh source (the PR #20/#22/#23
        # failure class the wipe guard exists for).
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4.2.0
        with:
          path: freerdp/build
          key: freerdp-native-${{ runner.os }}-${{ hashFiles('freerdp/build.gradle.kts') }}

      - name: Install patch (proot-patches are applied by fetchLinuxSource)
        run: sudo apt-get install -y -qq patch

      - name: Cache the Linux userspace native build tree
        # Same contract as the FreeRDP restore above: needs:native guarantees
        # the native job's post-step save of this exact key is visible here,
        # so :linux's preBuild-wired fetch and build tasks find their declared
        # outputs and go UP-TO-DATE. Restored, never written, and no
        # restore-keys for the same reason the FreeRDP cache has none.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4.2.0
        with:
          path: linux/build
          key: linux-native-${{ runner.os }}-${{ hashFiles('linux/build.gradle.kts', 'linux/proot-patches/*.patch') }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
        with:
          # Read-only off main so a pull request cannot poison the cache the
          # default branch reads.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Lint (release variant)
        run: ./gradlew --stacktrace lintRelease

  test:
    name: Unit and integration tests
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17.0.13
