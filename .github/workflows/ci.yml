# CI gate. Runs on every push to main, every pull request, and on demand.
#
# Pinned to commit SHAs for every `uses:` line so a future tag rewrite cannot
# silently change what the workflow does. Floating `@vN` references have been
# a real supply-chain vector in the last few years (tj-actions, action-gh-release
# force-push incidents) and the brief explicitly requires reproducible builds.
#
# Toolchain is pinned too: Ubuntu 24.04, JDK 17.0.13, Android SDK 37, build-tools
# 36.0.0, Gradle 9.7.1. The Android SDK is installed by the workflow itself,
# not assumed to be on the runner image, so the build bytes are not at the mercy
# of whatever ubuntu-latest happens to ship on a given Monday.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A follow-up push cancels the in-progress run on the same branch. A
  # pull_request run is NOT cancelled, because a cancelled PR check fails
  # branch protection with a status it cannot recover from.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dfile.encoding=UTF-8
  # Pinned to the exact build-tools version the build is verified against.
  # apksigner/aapt2 are addressed as $ANDROID_HOME/build-tools/$BUILD_TOOLS/...
  # so a future image cannot pick a different binary by accident.
  BUILD_TOOLS: '36.0.0'
  COMPILE_SDK: 'android-37.0'
  MIN_SDK: '28'
  TARGET_SDK: 'android-35'
  # The NDK and CMake the :freerdp and :linux modules' native builds are
  # pinned to (freerdp/build.gradle.kts, linux/build.gradle.kts - the two
  # deliberately share the NDK pin). Same pins the FreeRDP spike proved the
  # build with. The SDK manager does not carry CMake 4.x, hence the PyPI
  # install.
  FREERDP_NDK_VERSION: '29.0.13113456'
  FREERDP_CMAKE_VERSION: '4.1.2'

jobs:
  # One native build feeds every consumer. `native` compiles the four-ABI
  # FreeRDP tree and saves the freerdp/build cache; lint, test and assemble
  # restore that same tree, so every Gradle task wired into preBuild finds the
  # native outputs and goes UP-TO-DATE instead of rebuilding. Wall clock is
  # roughly native + the longest consumer, not the serial sum of everything
  # the old single job did. Branch protection must require the five check
  # names below (native, lint, test, assemble, smoke); the old combined
  # "Lint, tests, APKs and AAB" check is gone.
  native:
    name: FreeRDP native (4 ABIs)
    runs-on: ubuntu-24.04
    # Generous because the first run after any freerdp/build.gradle.kts change
    # pays a cold, uncached four-ABI native build (~30 min); warm runs are a
    # CMake no-op well inside this budget.
    timeout-minutes: 60

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17.0.13
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v4.1.0
        with:
          distribution: temurin
          java-version: '17.0.13'
          # check-latest=false forces the action to use the requested 17.0.13
          # rather than "the latest Temurin 17", which would silently drift.
          check-latest: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          # cmdline-tools 13.0 is the LTS line that ships platform-tools and
          # supports platforms;android-37.0 + build-tools;36.0.0.
          cmdline-tools-version: '11479570'
          packages: >-
            platform-tools
            platforms;${{ env.COMPILE_SDK }}
            build-tools;${{ env.BUILD_TOOLS }}
            ndk;${{ env.FREERDP_NDK_VERSION }}
          cache-packages: true
          # ANDROID_HOME / ANDROID_SDK_ROOT are exported automatically.

      - name: Install pinned CMake and Ninja
        # The :freerdp native build drives CMake directly (see
        # freerdp/build.gradle.kts for why it does not use AGP's
        # externalNativeBuild). The SDK manager does not carry the CMake line
        # that build needs; PyPI does. Same pin the spike verified with.
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check \
            "cmake==${FREERDP_CMAKE_VERSION}" ninja
          cmake --version | grep -F "cmake version ${FREERDP_CMAKE_VERSION}"
          ninja --version

      - name: Cache the FreeRDP native build tree
        # freerdp/build holds the extracted tarball, the per-ABI superbuild
        # trees (OpenSSL + FreeRDP + friends) and the packaged jniLibs. A cold
        # native build is roughly half an hour for four ABIs; a warm one is a
        # CMake no-op. The key carries the module's build script because that
        # is where the tarball, NDK and feature-set pins live - changing any of
        # them must produce a different cache entry. Restored before any Gradle
        # step: the first Gradle invocation (lint) already compiles :freerdp,
        # which builds the native libraries.
        #
        # This job is the only writer of this cache. lint, test and assemble
        # restore the same key after needs:native, by which point this job's
        # post-step save is already visible to them in the same run.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4.2.0
        with:
          path: freerdp/build
          key: freerdp-native-${{ runner.os }}-${{ hashFiles('freerdp/build.gradle.kts') }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
        with:
          # Read-only off main so a pull request cannot poison the cache the
          # default branch reads.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build and verify the :freerdp native module
        # Every :freerdp compilation depends on the native build task, so the
        # libraries exist by the time lint got here; this step still runs the
        # module's own packaging and asserts the product: all eight .so files
        # per ABI, and the bridge .so is an ELF binary for the architecture it
        # is filed under. A wrong-ABI library is exactly the failure packaging
        # would otherwise hide until install time - the same check the FreeRDP
        # spike used.
        run: |
          set -euo pipefail
          ./gradlew --stacktrace :freerdp:assembleDebug
          declare -A ELF_SIGNATURE=(
            [arm64-v8a]='ARM aarch64'
            [armeabi-v7a]='ARM, EABI5'
            [x86_64]='x86-64'
            [x86]='Intel 80386'
          )
          for ABI in arm64-v8a armeabi-v7a x86_64 x86; do
            for LIB in libfreerdp-android libfreerdp3 libfreerdp-client3 libwinpr3 \
                       libcrypto libssl libcjson liburiparser; do
              SO="freerdp/build/native/jniLibs/${ABI}/${LIB}.so"
              test -f "${SO}" || { echo "missing ${SO}"; exit 1; }
            done
            file "freerdp/build/native/jniLibs/${ABI}/libfreerdp-android.so" \
              | grep -F "${ELF_SIGNATURE[${ABI}]}"
            echo "verified ${ABI}: ${ELF_SIGNATURE[${ABI}]}"
          done

      - name: Install patch (proot-patches are applied by fetchLinuxSource)
        run: sudo apt-get install -y -qq patch

      - name: Cache the Linux userspace native build tree
        # linux/build holds the fetched proot-fork and talloc tarballs, the
        # per-ABI work trees and the packaged jniLibs. Same shape as the
        # FreeRDP cache beside it: this job is the only writer, and the key
        # carries the module's build script because that is where the
        # tarball, NDK and ABI pins live. A cold build is minutes (proot's
        # makefile is quick); a warm one is a download-free UP-TO-DATE.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4.2.0
        with:
          path: linux/build
          key: linux-native-${{ runner.os }}-${{ hashFiles('linux/build.gradle.kts', 'linux/proot-patches/*.patch') }}

      - name: Build and verify the :linux native module
        # Same product assertion as :freerdp above, plus the property the
        # userspace's exec model depends on: libproot.so and
        # libproot-loader.so must be static executables. A dynamic proot
        # would resolve its interpreter outside nativeLibraryDir and die at
        # exec time - a failure packaging cannot see. make, readelf and awk
        # (proot's makefile uses them) are preinstalled on the runner image.
        run: |
          set -euo pipefail
          ./gradlew --stacktrace :linux:assembleDebug
          declare -A ELF_SIGNATURE=(
            [arm64-v8a]='ARM aarch64'
            [armeabi-v7a]='ARM, EABI5'
            [x86_64]='x86-64'
          )
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            for LIB in libproot libproot-loader liblinuxpty; do
              SO="linux/build/native/jniLibs/${ABI}/${LIB}.so"
              test -f "${SO}" || { echo "missing ${SO}"; exit 1; }
            done
            file "linux/build/native/jniLibs/${ABI}/libproot.so" \
              | grep -F "${ELF_SIGNATURE[${ABI}]}"
            file "linux/build/native/jniLibs/${ABI}/libproot.so" \
              | grep -F 'statically linked'
            file "linux/build/native/jniLibs/${ABI}/libproot-loader.so" \
              | grep -F 'statically linked'
            file "linux/build/native/jniLibs/${ABI}/liblinuxpty.so" \
              | grep -F "${ELF_SIGNATURE[${ABI}]}"
            echo "verified ${ABI}: ${ELF_SIGNATURE[${ABI}]}"
          done

  lint:
    name: Lint (release variant)
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17.0.13
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v4.1.0
