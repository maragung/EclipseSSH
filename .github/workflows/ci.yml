name: CI

# Every push to main and every pull request: lint, the full unit and integration
# suites, the instrumentation sources, and both APKs as downloadable artifacts.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same branch makes the first run's answer irrelevant, and
# these runners are metered.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep the Gradle daemon out of the picture: one run, one JVM, no state to go stale.
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dfile.encoding=UTF-8

jobs:
  verify:
    name: Lint, tests and APKs
    runs-on: ubuntu-latest
    # The Robolectric suites run the app's real SSH stack against an in-process MINA
    # SSHD server, twice (debug and release variants), on a two-core runner.
    timeout-minutes: 90

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Caches ~/.gradle (dependencies and the build cache) and reports what it
      # restored. Writes are limited to main so a pull request cannot poison the
      # cache the default branch reads.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Robolectric fetches the android-all jar for the compile SDK on first use and
      # puts it in ~/.m2, which the Gradle cache above does not cover. Without this
      # every run downloads ~100 MB before the first test executes.
      - name: Cache Robolectric runtime jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'app/build.gradle.kts') }}
          restore-keys: robolectric-${{ runner.os }}-

      # Optional: with these two secrets set, the release APK is signed with the real
      # key. Without them the build falls back to the debug key and says so - CI stays
      # green either way, and the repository never carries signing material.
      - name: Restore release signing material
        id: signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PROPERTIES: ${{ secrets.RELEASE_KEYSTORE_PROPERTIES }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$RELEASE_KEYSTORE_PROPERTIES" ]; then
            mkdir -p keystore
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > keystore/eclipse-release.jks
            printf '%s\n' "$RELEASE_KEYSTORE_PROPERTIES" > keystore.properties
            chmod 600 keystore/eclipse-release.jks keystore.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No signing secrets set: the release APK will carry the debug key." >&2
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint (release variant)
        run: ./gradlew --stacktrace lintRelease

      # One test in the suite talks to a real `sshd` rather than to MINA, because that
      # is the only way to see the interop gap: extension negotiation, `ext-info` and
      # `hostkeys-00@openssh.com` arriving unasked, an unknown global request answered
      # with SSH_MSG_REQUEST_FAILURE, a login shell behind a real pty, `sftp-server` as
      # a subsystem process. "Connects, prints the motd, then says Reconnecting" is what
      # a bug in that gap looks like, and MINA-to-MINA tests cannot reproduce it.
      #
      # The sandbox is built here and thrown away below: its own host key, its own
      # authorized_keys, its own throwaway client key under .tmp-build/sshd-test, bound
      # to the loopback, sharing nothing with the runner's SSH configuration. It is
      # started before the tests because the test finds it by file, not by fixture, and
      # skips itself when it is absent.
      - name: Start the isolated OpenSSH sandbox
        run: |
          set -euo pipefail
          if ! command -v sshd >/dev/null 2>&1 && [ ! -x /usr/sbin/sshd ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq openssh-server
          fi
          tools/local-sshd.sh start
          # Asserted rather than assumed: on a runner that has `sshd`, a sandbox that did
          # not come up is a broken harness, and a skipped interop test looks identical to
          # a passing one in the summary.
          test -f .tmp-build/sshd-test/port
          # `MaxSessions 0`, for the login case that cannot be built any other way: a server
          # that accepts the key and then refuses the shell. Its absence would silently skip
          # the one test standing between this release and the reconnect mislabel returning.
          test -f .tmp-build/sshd-test/port-no-shell

      # The project's integration tests live in src/test: they drive the real
      # SshConnectionManager, TerminalChannel and SFTP client against a local MINA
      # SSHD server on a loopback port, so they need no emulator and no external host.
      - name: Unit and integration tests
        run: ./gradlew --stacktrace testDebugUnitTest testReleaseUnitTest

      # Before the reports are uploaded, so a failed test run still leaves no server
      # and no key material behind in a cached workspace.
      - name: Stop the OpenSSH sandbox
        if: always()
        run: tools/local-sshd.sh clean

      # No emulator here (see docs/ci.md), but the instrumentation sources must keep
      # compiling or they rot silently.
      - name: Compile instrumentation tests
        run: ./gradlew --stacktrace assembleDebugAndroidTest

      - name: Assemble APKs
        run: ./gradlew --stacktrace assembleDebug assembleRelease

      # Every output, not the first one. The build is split per ABI, so `head -1` would
      # have verified one APK out of five and reported the other four as checked.
      - name: Verify the release APK signatures
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner | sort -V | tail -1)"
          mapfile -t APKS < <(find app/build/outputs/apk/release -name '*.apk' | sort)
          # An empty list is a broken build, not a run with nothing to check.
          test "${#APKS[@]}" -eq 5 || { echo "expected 5 release APKs, found ${#APKS[@]}: ${APKS[*]}"; exit 1; }
          for APK in "${APKS[@]}"; do
            echo "== Verifying $APK"
            "$APKSIGNER" verify --verbose --min-sdk-version 28 --print-certs "$APK"
            if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
              # Both blocks must be there: v2 for anything below API 28 that ever installs a
              # copy, v3 because without it the key could never be rotated for installed ones.
              # Asked at min-sdk 24 deliberately - at 28 apksigner verifies through v3 alone and
              # reports v2 as false even when its block is present, so the stricter-looking
              # question is the one that cannot answer what is being asked.
              "$APKSIGNER" verify --verbose --min-sdk-version 24 "$APK" | tee /tmp/sigs.txt
              grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/sigs.txt
              grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" /tmp/sigs.txt
            fi
          done

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: eclipse-ssh-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: eclipse-ssh-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # The reports are what a red run is diagnosed from, so they are uploaded even
      # (especially) when a step above failed.
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: warn
          retention-days: 14

      # Signing material must not survive into any later step or a cached workspace.
      - name: Shred signing material
        if: always()
        run: |
          rm -f keystore.properties
          rm -rf keystore

  # The idle matrix, which does not belong in a gate that runs on every push: an hour of
  # genuinely silent sessions is an hour of a metered runner, and what it protects against
  # changes only when the keep-alive or idle-timeout code does. It holds one session at a
  # time for 30s, 1, 5, 10 and 30 minutes, plus a compressed one and one with the keep-alive
  # switched off - the case that proves switching it off also switches off the idle backstop
  # derived from it, which would otherwise drop a healthy session 150 seconds after login.
  #
  # It is the one test open long enough to cross the idle deadline the *shipped* default
  # implies - 30s keep-alive means MINA closes an untouched transport after 30*3+60 =
  # 150 seconds - so a heartbeat that stopped reaching the wire would drop a healthy
  # session about two and a half minutes after login and be invisible to every other
  # test here. Run it by hand from the Actions tab before cutting a release.
  stress:
    name: Long idle stress test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # The matrix holds a silent session for 30s + 1 + 5 + 5 + 5 + 10 + 30 minutes, one after
    # another, so the holds alone are just under an hour. 90 leaves room for the build and for
    # a slow runner without leaving a hung job to burn two hours.
    timeout-minutes: 90

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Cache Robolectric runtime jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'app/build.gradle.kts') }}
          restore-keys: robolectric-${{ runner.os }}-

      - name: Start the isolated OpenSSH sandbox
        run: |
          set -euo pipefail
          if ! command -v sshd >/dev/null 2>&1 && [ ! -x /usr/sbin/sshd ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq openssh-server
          fi
          tools/local-sshd.sh start
          # The silent port is what this job needs: `ClientAliveInterval 0`, so the app's
          # own heartbeat is the only traffic and the only thing keeping the session up.
          test -f .tmp-build/sshd-test/port-silent
          # This job runs the whole class, so it needs the no-shell port too - and with
          # ECLIPSE_STRESS set it may not skip, so a missing port would fail the job here
          # rather than confusingly, later, on an assumption.
          test -f .tmp-build/sshd-test/port-no-shell

      # The whole interop class, not one test: with ECLIPSE_STRESS set, the idle matrix
      # (30s / 1 / 5 / 10 / 30 minutes, keep-alive on and off, compression on and off) runs
      # alongside the interop tests the push gate already covers, and they share one sandbox.
      - name: The idle matrix against a real OpenSSH server
        env:
          ECLIPSE_STRESS: '1'
        run: |
          set -euo pipefail
          ./gradlew --stacktrace :app:testDebugUnitTest \
            --tests '*RealOpenSshInteropRobolectricTest'
          RESULTS=app/build/test-results/testDebugUnitTest/TEST-dev.eclipse.ssh.RealOpenSshInteropRobolectricTest.xml
          # A skipped test reads exactly like a passing one in the summary, and this job exists
          # only to run these, so an assumption that did not hold is a failure. Every gate in the
          # class is satisfied here - the sandbox is up, the silent port exists, ECLIPSE_STRESS is
          # set - so nothing in it is allowed to skip.
          grep -q 'skipped="0"' "$RESULTS"
          sed -n 's/.*\(tests="[0-9]*"\).*\(failures="[0-9]*"\).*/\1 \2/p' "$RESULTS" | head -1

      - name: Stop the OpenSSH sandbox
        if: always()
        run: tools/local-sshd.sh clean

      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 14
