# Tagged release. Triggered by a v* tag. Builds, signs, and publishes
# a GitHub release with the APKs and AAB attached.
#
# The third leg of the three-workflow pipeline:
#
#   .github/workflows/ci.yml            - CI validation
#   .github/workflows/release.yml       - Release build artifact (APKs+AAB+checksums)
#   .github/workflows/tagged-release.yml - this workflow. Publishes a GitHub release.
#
# The release is created as a DRAFT, regardless of tag shape, so a
# maintainer has to hit "Publish" in the GitHub UI. A v1.2.3-rc.1 tag
# is also marked pre-release automatically.
#
# Toolchain is pinned to JDK 17.0.13, Android SDK 37, build-tools 36.0.0
# on ubuntu-24.04. Every action is pinned to a commit SHA.
name: Tagged release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write  # create release, upload assets

concurrency:
  group: tagged-release-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dfile.encoding=UTF-8
  BUILD_TOOLS: '36.0.0'
  COMPILE_SDK: 'android-37.0'
  TARGET_SDK: 'android-35'
  # Same pins as ci.yml; the root-invoked assemble/bundle tasks compile the
  # :freerdp module, whose native build needs them.
  FREERDP_NDK_VERSION: '29.0.13113456'
  FREERDP_CMAKE_VERSION: '4.1.2'

jobs:
  tagged-release:
    name: Build, sign, and publish
    runs-on: ubuntu-24.04
    # Room for one cold :freerdp native build if the cache entry is cold or
    # was just re-keyed; a warm build fits the old budget.
    timeout-minutes: 120

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 17.0.13
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v4.1.0
        with:
          distribution: temurin
          java-version: '17.0.13'
          check-latest: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          cmdline-tools-version: '11479570'
          packages: >-
            platform-tools
            platforms;${{ env.COMPILE_SDK }}
            build-tools;${{ env.BUILD_TOOLS }}
            ndk;${{ env.FREERDP_NDK_VERSION }}
          cache-packages: true

      - name: Install pinned CMake and Ninja
        # The :freerdp native build drives CMake directly; the SDK manager
        # does not carry the 4.x line it needs. Same step as ci.yml.
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check \
            "cmake==${FREERDP_CMAKE_VERSION}" ninja
          cmake --version | grep -F "cmake version ${FREERDP_CMAKE_VERSION}"
          ninja --version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

      - name: Cache Robolectric runtime jars
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4.2.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ env.COMPILE_SDK }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: robolectric-${{ runner.os }}-${{ env.COMPILE_SDK }}-

      - name: Restore release signing material
        id: signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PROPERTIES: ${{ secrets.RELEASE_KEYSTORE_PROPERTIES }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$RELEASE_KEYSTORE_PROPERTIES" ]; then
            mkdir -p keystore
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > keystore/eclipse-release.jks
            printf '%s\n' "$RELEASE_KEYSTORE_PROPERTIES" > keystore.properties
            chmod 600 keystore/eclipse-release.jks keystore.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Release is being published signed with the debug key. The build will still succeed, but the artifact cannot upgrade an existing install."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify the build is from a clean tag
        run: |
          set -euo pipefail
          git describe --exact-match --tags HEAD
          echo "Building from tag: $(git describe --exact-match --tags HEAD)"

      - name: Clean the build tree
        # Run on its own, before the native cache restore below: the cache
        # populates freerdp/build, which a root-invoked `clean` (as the old
        # combined `clean assembleRelease bundleRelease` step ran it) would
        # delete again, forcing a cold four-ABI native build into every
        # tagged release.
        run: ./gradlew --stacktrace clean

      - name: Cache the FreeRDP native build tree
        # Same entry ci.yml restores; placed after `clean` so the restored
        # tree survives into the build.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4.2.0
        with:
          path: freerdp/build
          key: freerdp-native-${{ runner.os }}-${{ hashFiles('freerdp/build.gradle.kts') }}

      - name: Install patch (proot-patches are applied by fetchLinuxSource)
        run: sudo apt-get install -y -qq patch

      - name: Cache the Linux userspace native build tree
        # Same entry ci.yml restores, also placed after `clean`: the release
        # build compiles :linux (the userspace ships with :app), and a cold
        # proot build here would only add minutes to the release.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4.2.0
        with:
          path: linux/build
          key: linux-native-${{ runner.os }}-${{ hashFiles('linux/build.gradle.kts', 'linux/proot-patches/*.patch') }}

      - name: Bundle the AAB, then assemble the release APKs
        # Two separate invocations, in this order, on purpose. AGP (as of 9.4.0)
        # refuses to build a bundle while ABI splits are on - PerModuleBundleTask
        # reads the shared shrunk-resources directory expecting one file and
        # finds five (issuetracker.google.com/402800800) - so splits.abi stands
        # down whenever a bundle task shares the invocation. Assembling first
        # would not work either: the per-ABI files it leaves behind would crash
        # this later bundle task just the same. Bundle first, then assemble: the
        # AAB and the five APKs (four ABI splits + universal) all leave the job.
        run: |
          ./gradlew --stacktrace bundleRelease
          ./gradlew --stacktrace assembleRelease

      - name: Verify the release APK signatures
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          mapfile -t APKS < <(find app/build/outputs/apk/release -name '*.apk' | sort)
          test "${#APKS[@]}" -ge 1 || { echo "no release APKs found"; exit 1; }
          for APK in "${APKS[@]}"; do
            echo "== Verifying $APK"
            "$APKSIGNER" verify --verbose --min-sdk-version 28 --print-certs "$APK"
            if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
              "$APKSIGNER" verify --verbose --min-sdk-version 24 "$APK" | tee /tmp/sigs.txt
              grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/sigs.txt
              grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" /tmp/sigs.txt
            fi
          done

      - name: Verify the AAB signature
        # AABs use the JAR signature scheme (META-INF/{ALIAS}.SF/.RSA) rather
        # than the APK signature scheme, so apksigner verify cannot read
        # them. Assert the JAR signature blocks are present and well-formed.
        run: |
          set -euo pipefail
          AAB="$(find app/build/outputs/bundle/release -name '*.aab' | head -1)"
          test -n "$AAB" || { echo "no AAB found in app/build/outputs/bundle/release"; exit 1; }
          echo "== AAB under test: $AAB"
          unzip -l "$AAB" | grep -E 'META-INF/[^/]+\.(SF|RSA|DSA|EC)$' | tee /tmp/aab-sigs.txt
          grep -q '\.SF' /tmp/aab-sigs.txt || { echo "no JAR .SF in AAB"; exit 1; }
          grep -q '\.RSA\|\.DSA\|\.EC' /tmp/aab-sigs.txt || { echo "no JAR signature block in AAB"; exit 1; }
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            echo "AAB is signed with the release key."
          else
            echo "AAB is signed with the debug key (no release secrets in CI)."
          fi

      - name: Compute APK and AAB checksums
        # The simplest reliable form: append a section header, then
        # a `sha256sum` line that shows the basename rather than the
        # full path. `set -e` plus `shopt -s nullglob` mean an empty
        # APK directory is a no-op rather than a failure.
        run: |
          set -euo pipefail
          shopt -s nullglob
          {
            echo "# APKs (sha256)"
            for f in app/build/outputs/apk/release/*.apk; do
              sha256sum "$f" | awk '{sub(/^.*\//,"",$2); print $1"  "$2}'
            done
            echo
            echo "# AAB (sha256)"
            for f in app/build/outputs/bundle/release/*.aab; do
              sha256sum "$f" | awk '{sub(/^.*\//,"",$2); print $1"  "$2}'
            done
          } > app/build/outputs/SHA256SUMS.txt
          cat app/build/outputs/SHA256SUMS.txt

      - name: Resolve the release metadata
        id: meta
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if [[ "$TAG" == *"-"* ]]; then
            PRERELEASE="true"
          else
            PRERELEASE="false"
          fi
          AAPT2="$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt2"
          # Pick the first APK in the release directory. The per-ABI
          # splits were removed in favour of the AAB's per-ABI
          # splitting at Play install time, so the directory now
          # contains a single app-release.apk.
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -1)"
          test -n "$APK" || { echo "no APK found in app/build/outputs/apk/release"; exit 1; }
          BADGING="$("$AAPT2" dump badging "$APK")"
          VERSION_NAME="$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='[^']*' versionCode='\([0-9]*\)' versionName='\([^']*\)'.*$/\2/p" | head -1)"
          VERSION_CODE="$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='[^']*' versionCode='\([0-9]*\)' versionName='\([^']*\)'.*$/\1/p" | head -1)"
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "version_name=$VERSION_NAME"
            echo "version_code=$VERSION_CODE"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"
          echo "Tag=$TAG version=$VERSION versionName=$VERSION_NAME versionCode=$VERSION_CODE from $APK"

      - name: Compose release notes from the audit report
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          VERSION="${{ steps.meta.outputs.version }}"
          {
            echo "## EclipseSSH $TAG"
            echo
            echo "Built and signed by CI from the \`$TAG\` commit on \`${{ github.repository }}\`."
            echo
            if [ -f AUDIT-REPORT.md ]; then
              echo "### Audit summary"
              echo
              LAST="$(grep -E '^## [0-9]+\.' AUDIT-REPORT.md | tail -1 || true)"
              if [ -n "$LAST" ]; then
                echo "$LAST"
                echo
                echo "The full audit report is committed at the repository root as \`AUDIT-REPORT.md\`."
              fi
            fi
            echo
            echo "### Verification"
            echo
            echo "- \`./gradlew clean assembleRelease bundleRelease\` succeeded on a GitHub-hosted runner (Ubuntu 24.04, JDK 17.0.13, Android SDK 37, build-tools 36.0.0, NDK 29.0.13113456)"
            echo "- All release APKs verified with \`apksigner verify\` (v2 + v3)"
            echo "- The AAB is verified and uploaded alongside the per-ABI APKs"
            if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
              echo "- Signed with the release key (v2 + v3 schemes)"
            else
              echo "- Signed with the debug key (signing secrets not configured)"
            fi
            echo
            echo "### Checksums"
            echo
            echo "\`\`\`"
            cat app/build/outputs/SHA256SUMS.txt
            echo "\`\`\`"
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Create the GitHub release
        uses: softprops/action-gh-release@9d7c94cfd0a1f3ed45544c887983e9fa900f0564 # v2.0.4
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "EclipseSSH ${{ steps.meta.outputs.version }}"
          # Force DRAFT. A maintainer hits "Publish" in the GitHub UI to
          # make the release public. This applies even to v1.2.3 (no
          # -rc suffix), so a tag cannot accidentally ship a green
          # build that has not been reviewed.
          draft: true
          prerelease: ${{ steps.meta.outputs.prerelease }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/SHA256SUMS.txt

      - name: Shred signing material
        if: always()
        run: |
          rm -f keystore.properties
          rm -rf keystore
