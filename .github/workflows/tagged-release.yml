name: Tagged release

# Triggered by a `v*` tag. Builds, signs, and publishes a GitHub release with the APKs attached.
#
# This is the third leg of the three-workflow pipeline the brief calls for:
#
#   .github/workflows/ci.yml            - CI validation (lint, unit tests, instrumentation
#                                         compile, build, signature check) on every push and PR.
#   .github/workflows/release.yml       - Release build, on demand or on every push to main, that
#                                         produces the APKs as a downloadable artifact.
#   .github/workflows/tagged-release.yml - this workflow. A `git tag v* && git push --tags` runs
#                                          the same build under a release identity, signs with
#                                          the upload key if the secrets are set, and creates a
#                                          GitHub release with the APKs as binary assets and a
#                                          checksums file.
#
# Cutting a release:
#
#   git tag v1.2.3
#   git push origin v1.2.3
#
# The tag must match `v[0-9]+\.[0-9]+\.[0-9]+` (optionally with a pre-release suffix such as
# -rc.1, which is carried into the release title). Anything else is ignored - this keeps a
# developer from accidentally publishing a build under a non-release tag.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write  # Required to create the GitHub release and upload release assets.

concurrency:
  # A re-pushed tag cancels the previous run for that tag. The release being created is the
  # tag's identity, not the branch.
  group: tagged-release-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dfile.encoding=UTF-8

jobs:
  tagged-release:
    name: Build, sign, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # The full history is needed for the changelog / release notes.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Robolectric runtime jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'app/build.gradle.kts') }}
          restore-keys: robolectric-${{ runner.os }}-

      - name: Restore release signing material
        id: signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PROPERTIES: ${{ secrets.RELEASE_KEYSTORE_PROPERTIES }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$RELEASE_KEYSTORE_PROPERTIES" ]; then
            mkdir -p keystore
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > keystore/eclipse-release.jks
            printf '%s\n' "$RELEASE_KEYSTORE_PROPERTIES" > keystore.properties
            chmod 600 keystore/eclipse-release.jks keystore.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No signing secrets set: the release APK will carry the debug key." >&2
            echo "::warning::Release is being published signed with the debug key. The build will still succeed, but the artifact cannot upgrade an existing install."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify the build is from a clean tag
        # A release must be built from the tag exactly, not from a working copy that happens to
        # be on the same commit - otherwise the published artifact and the published source
        # can drift. `git describe` reports the tag at HEAD when HEAD is the tag.
        run: |
          set -euo pipefail
          git describe --exact-match --tags HEAD
          echo "Building from tag: $(git describe --exact-match --tags HEAD)"

      - name: Assemble the release APK
        run: ./gradlew --stacktrace clean assembleRelease

      - name: Verify the release APK signatures
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner | sort -V | tail -1)"
          mapfile -t APKS < <(find app/build/outputs/apk/release -name '*.apk' | sort)
          test "${#APKS[@]}" -eq 5 || { echo "expected 5 release APKs, found ${#APKS[@]}: ${APKS[*]}"; exit 1; }
          for APK in "${APKS[@]}"; do
            echo "== Verifying $APK"
            "$APKSIGNER" verify --verbose --min-sdk-version 28 --print-certs "$APK"
            if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
              "$APKSIGNER" verify --verbose --min-sdk-version 24 "$APK" | tee /tmp/sigs.txt
              grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/sigs.txt
              grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" /tmp/sigs.txt
            fi
          done

      - name: Compute APK checksums
        run: |
          set -euo pipefail
          cd app/build/outputs/apk/release
          for APK in *.apk; do
            sha256sum "$APK" | tee -a SHA256SUMS.txt
          done

      - name: Resolve the release metadata
        id: meta
        # Strip the leading "v" from the tag so the "name" is just the version, and pull the
        # versionName / versionCode from the manifest so the published metadata cannot drift
        # from the artifact. If the version is below the manifest, the release title and the
        # app's "About" screen would say different things, and only one of them would be
        # correct.
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          # Pre-release tags (e.g. v1.2.0-rc.1) become drafts and are marked as pre-release.
          if [[ "$TAG" == *"-"* ]]; then
            PRERELEASE="true"
            DRAFT="true"
          else
            PRERELEASE="false"
            DRAFT="false"
          fi
          AAPT2="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name aapt2 | sort -V | tail -1)"
          BADGING="$("$AAPT2" dump badging app/build/outputs/apk/release/app-arm64-v8a-release.apk)"
          VERSION_NAME="$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='[^']*' versionCode='\([0-9]*\)' versionName='\([^']*\)'.*$/\2/p" | head -1)"
          VERSION_CODE="$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='[^']*' versionCode='\([0-9]*\)' versionName='\([^']*\)'.*$/\1/p" | head -1)"
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "version_name=$VERSION_NAME"
            echo "version_code=$VERSION_CODE"
            echo "prerelease=$PRERELEASE"
            echo "draft=$DRAFT"
          } >> "$GITHUB_OUTPUT"
          echo "Tag=$TAG version=$VERSION versionName=$VERSION_NAME versionCode=$VERSION_CODE"

      - name: Compose release notes from the audit report
        # The committed AUDIT-REPORT.md is the canonical record of what shipped in a release;
        # the section whose number is the audit version is the release notes. If a future
        # release changes that format the section is still the right heading, and the sed
        # anchor fails loudly instead of silently producing a blank release.
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          VERSION="${{ steps.meta.outputs.version }}"
          {
            echo "## EclipseSSH $TAG"
            echo
            echo "Built and signed by CI from the \`$TAG\` commit on \`${{ github.repository }}\`."
            echo
            if [ -f AUDIT-REPORT.md ]; then
              echo "### Audit summary"
              echo
              # The report's per-section headings use the literal "## N. Title" pattern; the
              # latest section is what shipped in this tree.
              LAST="$(grep -E '^## [0-9]+\.' AUDIT-REPORT.md | tail -1 || true)"
              if [ -n "$LAST" ]; then
                echo "$LAST"
                echo
                echo "The full audit report is committed at the repository root as \`AUDIT-REPORT.md\`."
              fi
            fi
            echo
            echo "### Verification"
            echo
            echo "- \`./gradlew clean assembleRelease\` succeeded on a GitHub-hosted runner (Ubuntu, JDK 17)"
            echo "- All release APKs verified with \`apksigner verify\`"
            if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
              echo "- Signed with the release key (v2 + v3 schemes)"
            else
              echo "- Signed with the debug key (signing secrets not configured)"
            fi
            echo
            echo "### Checksums"
            echo
            echo "\`\`\`"
            cat app/build/outputs/apk/release/SHA256SUMS.txt
            echo "\`\`\`"
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "EclipseSSH ${{ steps.meta.outputs.version }}"
          draft: ${{ steps.meta.outputs.draft }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/SHA256SUMS.txt

      - name: Shred signing material
        if: always()
        run: |
          rm -f keystore.properties
          rm -rf keystore
