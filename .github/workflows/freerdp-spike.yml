# FreeRDP Android build spike.
#
# Before any RDP wiring lands in the app, this workflow answers one question:
# does FreeRDP's documented standalone Android build (docs/README.android in
# their tree) actually work on a GitHub-hosted runner, with a pinned NDK, a
# pinned CMake and a pinned source tarball? Every later step - the JNI bridge
# module, the RdpTunnel, the viewer - assumes the answer is yes, so the answer
# is bought first, on its own branch, with no app code involved.
#
# It builds only the native libraries, the way upstream's `qa` build type does:
# OpenSSL and cJSON on, every optional codec (FFmpeg, OpenH264, Opus, WebP,
# JPEG, PNG) off. The optional codecs cover audio, H.264 and lossy still-image
# compression that a viewer on a phone can live without; OpenSSL is the one
# dependency RDP cannot connect without (TLS/NLA), and cJSON stays on because
# upstream keeps it on even in their leanest configuration.
#
# One ABI per run for the spike. arm64-v8a is where every real phone is; the
# other three ABIs are proven once this one is green, not before.
#
# Pinned like ci.yml: every `uses:` by commit SHA, every tool by exact version,
# the tarball by its published SHA256 - the build has to be reproducible and
# has to fail rather than silently build something else.
name: FreeRDP Android spike

on:
  workflow_dispatch:
  push:
    branches: [spike/freerdp-android]

permissions:
  contents: read

concurrency:
  group: freerdp-spike-${{ github.ref }}
  cancel-in-progress: true

env:
  # The FreeRDP release this spike proves. Upstream's own Android Studio
  # project pins the same line (client/Android/Studio/build.gradle, release
  # 3.31.1); the sha256 is the one published beside the tarball on the
  # release page.
  FREERDP_VERSION: '3.31.1'
  FREERDP_SHA256: '4a2629026896cb4e26fb8ed2d6ca6aa4ab89ca95528dfbae2550c2f6bc866991'
  # The NDK upstream's freeRDPCore module builds with (their ndkVersion).
  NDK_VERSION: '29.0.13113456'
  # CMake from PyPI because the SDK manager's CMake does not track the version
  # upstream pins (4.1.2), and CMake 4 removes the <3.5 policy compatibility
  # the NDK r29 toolchain file no longer needs but older CMake builds trip on.
  CMAKE_VERSION: '4.1.2'
  # android-28, not the README's android-23: the .so must not require less
  # than the app's minSdk, and must not promise more than it.
  ANDROID_PLATFORM_LEVEL: 'android-28'
  ABI: 'arm64-v8a'

jobs:
  native-build:
    name: Native FreeRDP build (arm64-v8a)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Set up Android SDK with the pinned NDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          # No SDK packages of our own - the NDK is the only SDK piece this
          # build touches, and not caching it: the SDK cache is sized for the
          # app's CI, and a multi-GB NDK would evict it.
          packages: >-
            ndk;${{ env.NDK_VERSION }}
          cache-packages: false

      - name: Install pinned CMake and Ninja
        run: |
          python3 -m pip install --disable-pip-version-check "cmake==${CMAKE_VERSION}" ninja
          cmake --version | grep -F "cmake version ${CMAKE_VERSION}"
          ninja --version

      - name: Fetch the pinned FreeRDP source
        run: |
          curl -fsSL -o freerdp.tar.gz \
            "https://github.com/FreeRDP/FreeRDP/releases/download/${FREERDP_VERSION}/freerdp-${FREERDP_VERSION}.tar.gz"
          echo "${FREERDP_SHA256}  freerdp.tar.gz" | sha256sum -c -
          tar xzf freerdp.tar.gz
          test -d "freerdp-${FREERDP_VERSION}"

      # The configure+build pair is docs/README.android's "Building native
      # libraries standalone" recipe, with the lean feature set of upstream's
      # qa build type. The superbuild fetches and cross-compiles OpenSSL and
      # cJSON itself, which is why this step is the long one.
      - name: Configure the superbuild
        run: |
          export ANDROID_NDK="${ANDROID_HOME}/ndk/${NDK_VERSION}"
          test -f "${ANDROID_NDK}/build/cmake/android.toolchain.cmake"
          cmake -S "freerdp-${FREERDP_VERSION}/client/Android/Studio/freeRDPCore/src/main/cpp" \
                -B "build/${ABI}" \
                --toolchain "${ANDROID_NDK}/build/cmake/android.toolchain.cmake" \
                -DANDROID_ABI="${ABI}" \
                -DANDROID_PLATFORM="${ANDROID_PLATFORM_LEVEL}" \
                -DCMAKE_BUILD_TYPE=Release \
                -DWITH_FFMPEG=OFF \
                -DWITH_OPENH264=OFF \
                -DWITH_OPUS=OFF \
                -DWITH_WEBP=OFF \
                -DWITH_JPEG=OFF \
                -DWITH_PNG=OFF \
                -DWITH_CJSON=ON \
                -DWITH_OPENSSL=ON \
                -GNinja

      - name: Build
        run: cmake --build "build/${ABI}"

      # The spike's verdict step: the JNI bridge library exists, is a shared
      # object for the right architecture, and did not come alone - the
      # FreeRDP/WinPR/OpenSSL libraries it links are in the build tree too.
      - name: Verify the native libraries
        run: |
          set -euo pipefail
          find "build/${ABI}" -name '*.so*' | sort
          bridge=$(find "build/${ABI}" -name 'libfreerdp-android.so' | head -1)
          test -n "${bridge}"
          file "${bridge}" | grep -F 'ELF 64-bit LSB shared object'
          file "${bridge}" | grep -F 'ARM aarch64'
          for lib in libfreerdp3 libfreerdp-client3 libwinpr3 libcrypto libssl; do
            found=$(find "build/${ABI}" -name "${lib}*.so*" | head -1)
            test -n "${found}" || { echo "missing: ${lib}"; exit 1; }
          done

      - name: Upload the native libraries
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.6.1
        with:
          name: freerdp-native-${{ env.ABI }}
          path: build/${{ env.ABI }}/**/*.so
          if-no-files-found: error
          retention-days: 7
