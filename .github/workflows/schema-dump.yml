# One-off generator for the Room schema JSON. Run it after adding a migration
# (DB version bump), take the app/schemas artifact it uploads, and commit the
# new version's JSON - the committed schemas are the record of what each shipped
# version looked like, and the next migration's step test seeds from them.
#
# Same pinned toolchain as ci.yml, for the same reasons ci.yml pins it: the
# schema JSON's identityHash is a hash of the compiled entity descriptors, so a
# different compiler or Room version could mint a different hash and break the
# committed chain. Nothing here is trusted with secrets; permissions stay read.
name: Schema dump

on:
  workflow_dispatch:
  # A PR that changes the database layer dumps its own schema: dispatch by API
  # only works once the workflow exists on the default branch, so the pull_request
  # trigger is how the very first migration after this workflow lands gets its
  # JSON. Paths-filtered so ordinary PRs do not pay for it.
  pull_request:
    paths:
      - 'app/src/main/java/dev/eclipse/ssh/data/local/**'
      - 'app/src/main/java/dev/eclipse/ssh/data/model/Models.kt'
      - '.github/workflows/schema-dump.yml'

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dfile.encoding=UTF-8
  BUILD_TOOLS: '36.0.0'
  COMPILE_SDK: 'android-37.0'
  # Same pins as ci.yml: :app depends on :freerdp, so even this ksp-only
  # invocation compiles the native module (preBuild hangs off every variant
  # compilation) and needs the toolchain that builds it.
  FREERDP_NDK_VERSION: '29.0.13113456'
  FREERDP_CMAKE_VERSION: '4.1.2'

jobs:
  dump:
    name: Generate app/schemas
    runs-on: ubuntu-24.04
    # Room for one cold :freerdp native build if the cache entry is cold or was
    # just re-keyed; a warm build fits the old budget.
    timeout-minutes: 60

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17.0.13
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v4.1.0
        with:
          distribution: temurin
          java-version: '17.0.13'
          check-latest: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          cmdline-tools-version: '11479570'
          packages: >-
            platform-tools
            platforms;${{ env.COMPILE_SDK }}
            build-tools;${{ env.BUILD_TOOLS }}
            ndk;${{ env.FREERDP_NDK_VERSION }}
          cache-packages: true

      - name: Install pinned CMake and Ninja
        # The :freerdp native build drives CMake directly; the SDK manager
        # does not carry the 4.x line it needs. Same step as ci.yml.
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check \
            "cmake==${FREERDP_CMAKE_VERSION}" ninja
          cmake --version | grep -F "cmake version ${FREERDP_CMAKE_VERSION}"
          ninja --version

      - name: Cache the FreeRDP native build tree
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4.2.0
        with:
          path: freerdp/build
          key: freerdp-native-${{ runner.os }}-${{ hashFiles('freerdp/build.gradle.kts') }}

      - name: Install patch (proot-patches are applied by fetchLinuxSource)
        run: sudo apt-get install -y -qq patch

      - name: Cache the Linux userspace native build tree
        # :app depends on :linux, so even this ksp-only build compiles the
        # module and pays its native preBuild task - same reasoning as the
        # FreeRDP restore above. Read-only: ci.yml's native job owns the key.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4.2.0
        with:
          path: linux/build
          key: linux-native-${{ runner.os }}-${{ hashFiles('linux/build.gradle.kts', 'linux/proot-patches/*.patch') }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

      # ksp, not a full build: the schema JSON is written by Room's annotation
      # processor at compile time (room.schemaLocation in app/build.gradle.kts),
      # and ksp*Kotlin alone runs it. Debug variant is enough — the schema is
      # variant-independent; only the entity set matters.
      - name: Run ksp to write the schema JSONs
        run: ./gradlew :app:kspDebugKotlin

      # The account's artifact storage quota is shared across its private repos, and when it is
      # full the upload step fails the job even though the schema it was meant to carry sits right
      # there in the workspace. So the files are ALSO printed to the log between markers — small,
      # text, and the log API is not metered the way artifact storage is — and the upload is
      # non-fatal (the same call ci.yml made when it hit this). Take the JSON from whichever
      # channel works.
      - name: Print the current schema JSON to the log
        run: |
          current=$(grep -o 'version = [0-9]*' app/src/main/java/dev/eclipse/ssh/data/local/HostDatabase.kt | grep -o '[0-9]*' | head -1)
          echo "SCHEMA_DUMP_BEGIN_$current"
          cat "app/schemas/dev.eclipse.ssh.data.local.EclipseDatabase/$current.json"
          echo
          echo "SCHEMA_DUMP_END_$current"

      - name: Upload schemas
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: room-schemas
          path: app/schemas/
          if-no-files-found: error
        continue-on-error: true # storage quota is account-wide; the log above carries the JSON
