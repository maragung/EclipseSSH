# Release build, on demand or on every push to main. A separate workflow
# from ci.yml so the push/PR gate stays fast and a release can be rebuilt
# at any time without rerunning lint and the full test suite. A tag push
# triggers the heavier tagged-release.yml workflow.
#
# Every action is pinned to a commit SHA. A floating @vN is a mutable
# pointer, and a few GitHub actions have been rewritten under the same
# tag in the last few years; pinning the SHA closes that.
name: Release build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A second push to main cancels the first. The release on main is
  # built from whatever HEAD looks like at the moment the runner wakes.
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dfile.encoding=UTF-8
  BUILD_TOOLS: '36.0.0'
  COMPILE_SDK: 'android-37.0'
  TARGET_SDK: 'android-35'
  # Same pins as ci.yml; the root-invoked assemble/bundle tasks compile the
  # :freerdp and :linux modules, whose native builds need them.
  FREERDP_NDK_VERSION: '29.0.13113456'
  FREERDP_CMAKE_VERSION: '4.1.2'

jobs:
  release:
    name: Build signed release artifacts
    runs-on: ubuntu-24.04
    # A manual approval gate is set on this job's environment (`release`),
    # so a merge to main does not immediately publish. Configure reviewers
    # in Settings -> Environments -> release. The push trigger exists for
    # forks that have not configured an environment, and to make the
    # workflow visible on every push.
    environment: release
    # The :freerdp native build is warm from the actions/cache entry ci.yml
    # saved, but a changed cache key makes this job pay the cold ~30-minute
    # four-ABI build once.
    timeout-minutes: 90

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17.0.13
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v4.1.0
        with:
          distribution: temurin
          java-version: '17.0.13'
          check-latest: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          cmdline-tools-version: '11479570'
          packages: >-
            platform-tools
            platforms;${{ env.COMPILE_SDK }}
            build-tools;${{ env.BUILD_TOOLS }}
            ndk;${{ env.FREERDP_NDK_VERSION }}
          cache-packages: true

      - name: Install pinned CMake and Ninja
        # The :freerdp native build drives CMake directly; the SDK manager
        # does not carry the 4.x line it needs. Same step as ci.yml.
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check \
            "cmake==${FREERDP_CMAKE_VERSION}" ninja
          cmake --version | grep -F "cmake version ${FREERDP_CMAKE_VERSION}"
          ninja --version

      - name: Cache the FreeRDP native build tree
        # Same entry ci.yml restores: warm builds skip configure and Ninja
        # rebuilds nothing. The release build is a release of exactly what CI
        # verified, so sharing the cache keeps that literally true.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: freerdp/build
          key: freerdp-native-${{ runner.os }}-${{ hashFiles('freerdp/build.gradle.kts') }}

      - name: Install patch (proot-patches are applied by fetchLinuxSource)
        run: sudo apt-get install -y -qq patch

      - name: Cache the Linux userspace native build tree
        # Same entry ci.yml restores, for the same reason: the release APK
        # ships the userspace, built from exactly the tree CI verified.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: linux/build
          key: linux-native-${{ runner.os }}-${{ hashFiles('linux/build.gradle.kts', 'linux/proot-patches/*.patch') }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Cache Robolectric runtime jars
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ env.COMPILE_SDK }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: robolectric-${{ runner.os }}-${{ env.COMPILE_SDK }}-

      - name: Restore release signing material
        id: signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PROPERTIES: ${{ secrets.RELEASE_KEYSTORE_PROPERTIES }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$RELEASE_KEYSTORE_PROPERTIES" ]; then
            mkdir -p keystore
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > keystore/eclipse-release.jks
            printf '%s\n' "$RELEASE_KEYSTORE_PROPERTIES" > keystore.properties
            chmod 600 keystore/eclipse-release.jks keystore.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No signing secrets set: the release APK will carry the debug key." >&2
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bundle the AAB, then assemble the release APKs
        # Two separate invocations, in this order, on purpose. AGP (as of 9.4.0)
        # refuses to build a bundle while ABI splits are on - PerModuleBundleTask
        # reads the shared shrunk-resources directory expecting one file and
        # finds five (issuetracker.google.com/402800800) - so splits.abi stands
        # down whenever a bundle task shares the invocation. Assembling first
        # would not work either: the per-ABI files it leaves behind would crash
        # this later bundle task just the same. Bundle first, then assemble: the
        # AAB and the five APKs (four ABI splits + universal) all leave the job.
        run: |
          ./gradlew --stacktrace bundleRelease
          ./gradlew --stacktrace assembleRelease

      - name: Verify the release APK signatures
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          mapfile -t APKS < <(find app/build/outputs/apk/release -name '*.apk' | sort)
          test "${#APKS[@]}" -ge 1 || { echo "no release APKs found"; exit 1; }
          for APK in "${APKS[@]}"; do
            echo "== Verifying $APK"
            "$APKSIGNER" verify --verbose --min-sdk-version 28 --print-certs "$APK"
            if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
              "$APKSIGNER" verify --verbose --min-sdk-version 24 "$APK" | tee /tmp/sigs.txt
              grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/sigs.txt
              grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" /tmp/sigs.txt
            fi
          done

      - name: Verify the AAB signature
        # AABs use the JAR signature scheme (META-INF/{ALIAS}.SF/.RSA) rather
        # than the APK signature scheme, so apksigner verify cannot read
        # them. Assert the JAR signature blocks are present and well-formed.
        run: |
          set -euo pipefail
          AAB="$(find app/build/outputs/bundle/release -name '*.aab' | head -1)"
          test -n "$AAB" || { echo "no AAB found in app/build/outputs/bundle/release"; exit 1; }
          echo "== AAB under test: $AAB"
          unzip -l "$AAB" | grep -E 'META-INF/[^/]+\.(SF|RSA|DSA|EC)$' | tee /tmp/aab-sigs.txt
          grep -q '\.SF' /tmp/aab-sigs.txt || { echo "no JAR .SF in AAB"; exit 1; }
          grep -q '\.RSA\|\.DSA\|\.EC' /tmp/aab-sigs.txt || { echo "no JAR signature block in AAB"; exit 1; }
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            echo "AAB is signed with the release key."
          else
            echo "AAB is signed with the debug key (no release secrets in CI)."
          fi

      - name: Compute APK and AAB checksums
        run: |
          set -euo pipefail
          shopt -s nullglob
          {
            echo "# APKs (sha256)"
            for f in app/build/outputs/apk/release/*.apk; do
              sha256sum "$f" | awk '{sub(/^.*\//,"",$2); print $1"  "$2}'
            done
            echo
            echo "# AAB (sha256)"
            for f in app/build/outputs/bundle/release/*.aab; do
              sha256sum "$f" | awk '{sub(/^.*\//,"",$2); print $1"  "$2}'
            done
          } > app/build/outputs/SHA256SUMS.txt
          cat app/build/outputs/SHA256SUMS.txt

      - name: Upload release APKs, AAB and checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eclipse-ssh-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/SHA256SUMS.txt
          if-no-files-found: error

      - name: Shred signing material
        if: always()
        run: |
          rm -f keystore.properties
          rm -rf keystore
