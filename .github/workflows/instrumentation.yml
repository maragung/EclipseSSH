# Instrumentation tests (connectedAndroidTest). Separated from ci.yml
# because an emulator boot plus the full instrumented suite is a much
# longer pipeline than the rest of CI, and deserves its own timeout and
# its own concurrency group.
#
# The brief calls for "Android instrumentation tests on every push/PR".
# This used to wait for a self-hosted `android-emulator` runner that was
# never provisioned, so every run sat queued forever and had to be
# cancelled. GitHub's Linux runners expose /dev/kvm, which is all the
# emulator needs: the workflow now boots its own headless AVD on the
# hosted pool and the suite actually runs.
name: Instrumentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # An instrumented suite is expensive. Do not cancel in-flight PR runs,
  # because the cancelled status fails branch protection with no chance
  # to retry.
  group: instrumentation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dfile.encoding=UTF-8
  BUILD_TOOLS: '36.0.0'
  COMPILE_SDK: 'android-37.0'
  TARGET_SDK: 'android-35'
  # Same pins as ci.yml: connectedDebugAndroidTest compiles :app's androidTest
  # sources, and :app depends on :freerdp and :linux - whose native builds
  # need the NDK toolchain and a CMake the SDK manager does not carry.
  FREERDP_NDK_VERSION: '29.0.13113456'
  FREERDP_CMAKE_VERSION: '4.1.2'
  SYSTEM_IMAGE: 'system-images;android-35;default;x86_64'

jobs:
  instrumentation:
    name: connectedAndroidTest
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17.0.13
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v4.1.0
        with:
          distribution: temurin
          java-version: '17.0.13'
          check-latest: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          cmdline-tools-version: '11479570'
          packages: >-
            platform-tools
            emulator
            system-images;${{ env.SYSTEM_IMAGE }}
            platforms;${{ env.COMPILE_SDK }}
            build-tools;${{ env.BUILD_TOOLS }}
            ndk;${{ env.FREERDP_NDK_VERSION }}
          cache-packages: true

      - name: Install pinned CMake and Ninja
        # The :freerdp native build drives CMake directly; the SDK manager
        # does not carry the 4.x line it needs. Same step as ci.yml.
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check \
            "cmake==${FREERDP_CMAKE_VERSION}" ninja
          cmake --version | grep -F "cmake version ${FREERDP_CMAKE_VERSION}"
          ninja --version

      - name: Cache the FreeRDP native build tree
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4.2.0
        with:
          path: freerdp/build
          key: freerdp-native-${{ runner.os }}-${{ hashFiles('freerdp/build.gradle.kts') }}

      - name: Cache the Linux userspace native build tree
        # Read-only restore of the entry ci.yml's native job saves; the
        # instrumentation build compiles :app, which compiles :linux.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4.2.0
        with:
          path: linux/build
          key: linux-native-${{ runner.os }}-${{ hashFiles('linux/build.gradle.kts') }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Restore release signing material
        id: signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PROPERTIES: ${{ secrets.RELEASE_KEYSTORE_PROPERTIES }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$RELEASE_KEYSTORE_PROPERTIES" ]; then
            mkdir -p keystore
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > keystore/eclipse-release.jks
            printf '%s\n' "$RELEASE_KEYSTORE_PROPERTIES" > keystore.properties
            chmod 600 keystore/eclipse-release.jks keystore.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No signing secrets: instrumentation will use the debug key." >&2
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Enable KVM device permissions
        # The runner image ships /dev/kvm, but the runner user needs a udev
        # rule to open it. Without this the emulator falls back to software
        # emulation, which does not boot API 35 inside any sane timeout.
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -w /dev/kvm

      - name: Create and boot the headless AVD
        run: |
          set -euo pipefail
          ADB="$ANDROID_HOME/platform-tools/adb"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --force --name ci-instrumented \
            --package "$SYSTEM_IMAGE" \
            --device pixel_6
          nohup "$ANDROID_HOME/emulator/emulator" -avd ci-instrumented \
            -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics \
            -gpu swiftshader_indirect -accel on > /tmp/emulator.log 2>&1 &
          "$ADB" wait-for-device
          # adb sees the emulator long before the guest OS is up;
          # sys.boot_completed is the flag the platform itself sets when
          # the boot intent fires.
          BOOT=""
          for _ in $(seq 1 60); do
            BOOT="$("$ADB" shell getprop sys.boot_completed | tr -d '\r')"
            [ "$BOOT" = "1" ] && break
            sleep 5
          done
          if [ "$BOOT" != "1" ]; then
            echo "emulator did not finish booting"
            tail -200 /tmp/emulator.log
            exit 1
          fi

      - name: Run connectedAndroidTest
        # The emulator booted above is the only device adb can see, so the
        # default single-device selection is correct. The suite reports into
        # the standard connected-test directories uploaded below.
        run: ./gradlew --stacktrace connectedDebugAndroidTest

      - name: Upload the emulator log
        # The device-side evidence for a failed suite is usually in here:
        # a crash in setup, an ANR, or the guest rebooting mid-run.
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: emulator-log
          path: /tmp/emulator.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: instrumentation-reports
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          if-no-files-found: warn
          retention-days: 14

      - name: Shred signing material
        if: always()
        run: |
          rm -f keystore.properties
          rm -rf keystore
