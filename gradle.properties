# Gradle daemon tuning. The daemon is disabled in CI (see the
# `GRADLE_OPTS` env var in every workflow); the `org.gradle.daemon`
# line below covers the local case.
org.gradle.daemon=false
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache is on, but the project's test JVM opts out where
# Hilt's KSP processor cannot round-trip through it. The opt-out is
# per-task, not global.
org.gradle.configuration-cache=true
# Two workers. Verified by the test matrix in AUDIT-REPORT.md §10:
# three or more saturate the host and Robolectric tests start timing
# out on the second variant.
org.gradle.workers.max=2
# Stable configuration cache feature. AGP 8.9.x requires this opt-in
# for the cache to be reliably reusable across runners.
org.gradle.unsafe.configuration-cache=false

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true
# Disable Jetifier explicitly. The project does not depend on any
# support-library artefact; leaving Jetifier's default on is silent
# and slow.
android.enableJetifier=false
# Strict shrinking. The release variant's R8 keep rules are validated
# against the shipped APK (AUDIT-REPORT.md §6).
android.enableR8.fullMode=true

# Kotlin
kotlin.code.style=official
kotlin.incremental=true
ksp.incremental=true
# The daemon JVM is sized for two parallel test workers; the same
# value as org.gradle.jvmargs so the test JVM and the build JVM agree.
kotlin.daemon.jvmargs=-Xmx2g
