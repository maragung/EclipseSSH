# slf4j-simple configuration.
#
# Without this file slf4j-simple defaults to INFO on System.err, which on Android means
# logcat. Apache MINA SSHD is chatty at that level and names hosts, users and negotiated
# algorithms, so a release build of an SSH client would publish connection metadata to
# logcat and into any bug report or `adb logcat` capture — and pay for the string
# formatting on the SSH I/O path while doing it.
#
# WARN keeps the diagnostics that indicate an actual problem (handshake failures, host key
# mismatches, dropped channels) and drops the routine per-session narration.
org.slf4j.simpleLogger.defaultLogLevel=warn

# Timestamps and thread names duplicate what logcat already stamps on every line.
org.slf4j.simpleLogger.showDateTime=false
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showShortLogName=true
